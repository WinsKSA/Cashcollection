<title>ونس — إدارة النقدية</title>
<style>
/* ============ WINS · ونس — dark premium cash control ============ */
:root{
  --void:#06070B;
  --void-2:#0A0C12;
  --surface:rgba(255,255,255,.04);
  --surface-solid:#0E1017;
  --elev:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.085);
  --line-bright:rgba(255,255,255,.18);
  --ink:#F4F5FA;
  --ink-dim:#9AA0B4;
  --ink-faint:#5E6479;
  --mint:#00E6A2;
  --mint-2:#37F5C0;
  --mint-deep:#00A876;
  --mint-soft:rgba(0,230,162,.13);
  /* Official WINS brand gold — the logo is always rendered in this colour
     and is never recoloured or restyled. */
  --brand:#C9A04D;
  --brand-lift:#E4BE72;
  --gold:#FFC46B;
  --gold-soft:rgba(255,196,107,.14);
  --violet:#8B7BFF;
  --violet-soft:rgba(139,123,255,.14);
  --rose:#FF6B6B;
  --rose-soft:rgba(255,107,107,.14);
  --glow-mint:0 0 0 1px rgba(0,230,162,.25), 0 8px 40px -8px rgba(0,230,162,.45);
  --glow-gold:0 0 0 1px rgba(255,196,107,.22), 0 8px 34px -10px rgba(255,196,107,.4);
  --shadow:0 2px 6px rgba(0,0,0,.4), 0 18px 50px -20px rgba(0,0,0,.85);
  --shadow-lg:0 30px 90px -28px rgba(0,0,0,.95);
  --r:18px; --r-sm:12px;
  --font-display:'Cairo',system-ui,'Segoe UI',sans-serif;
  --font-body:'Cairo',system-ui,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--ink);
  font-family:var(--font-body);
  margin:0;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
::selection{background:var(--mint);color:#04211A}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:content-box}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ---------- ambient aurora ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora b{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5}
.aurora b:nth-child(1){width:52vw;height:52vw;background:radial-gradient(circle,rgba(0,230,162,.5),transparent 68%);top:-16vw;inset-inline-start:-10vw;animation:drift1 26s ease-in-out infinite}
.aurora b:nth-child(2){width:44vw;height:44vw;background:radial-gradient(circle,rgba(139,123,255,.42),transparent 68%);bottom:-16vw;inset-inline-end:-8vw;animation:drift2 32s ease-in-out infinite}
.aurora b:nth-child(3){width:34vw;height:34vw;background:radial-gradient(circle,rgba(255,196,107,.28),transparent 70%);top:38%;inset-inline-start:42%;animation:drift3 38s ease-in-out infinite}
.aurora::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 20%,var(--void) 78%)}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,7vh,0) scale(1.14)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.06)}50%{transform:translate3d(-7vw,-5vh,0) scale(1)}}
@keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(.94)}50%{transform:translate3d(-5vw,6vh,0) scale(1.16)}}

/* ---------- splash / boot ---------- */
#loading-gate{
  position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;background:var(--void);
  transition:opacity .7s ease,visibility .7s;
}
#loading-gate.out{opacity:0;visibility:hidden}
.splash-halo{
  position:absolute;width:min(78vw,380px);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(201,160,77,.30),rgba(201,160,77,.07) 45%,transparent 68%);
  animation:splashHalo 5s ease-in-out both;
}
.boot-logo{width:min(52vw,210px);color:var(--brand)}
.boot-word{width:min(38vw,152px);color:var(--brand)}
/* Every glyph of the mark and every letter of the wordmark animates on its
   own timeline: fades in one by one, holds, then fades out one by one.
   --din / --dout are set per glyph inline. */
.glyph{animation:glyphIn .75s cubic-bezier(.16,1,.3,1) both var(--din,0s),
                 glyphOut .6s ease-in both var(--dout,4s)}
@keyframes glyphIn{
  from{opacity:0;transform:translateY(16px) scale(.72)}
  to{opacity:1;transform:none}
}
@keyframes glyphOut{
  from{opacity:1;transform:none}
  to{opacity:0;transform:translateY(-14px) scale(1.14)}
}
.splash-welcome{
  margin-top:8px;text-align:center;
  animation:welcomeIn .9s cubic-bezier(.16,1,.3,1) both 2.35s,
            glyphOut .55s ease-in both 4.05s;
}
.splash-welcome b{
  display:block;font-size:clamp(17px,4.4vw,23px);font-weight:800;letter-spacing:.01em;
  background:linear-gradient(100deg,var(--brand) 12%,var(--brand-lift) 45%,var(--brand) 78%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% 100%;animation:shimmer 2.8s ease-in-out infinite;
}
.splash-welcome span{display:block;margin-top:7px;font-size:12.5px;color:var(--ink-faint);letter-spacing:.14em}
@keyframes welcomeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes splashHalo{
  0%{opacity:0;transform:scale(.4)}
  38%{opacity:1;transform:scale(1)}
  80%{opacity:.9;transform:scale(1.06)}
  100%{opacity:0;transform:scale(1.45)}
}
@media (prefers-reduced-motion:reduce){
  .boot-logo,.boot-word,.splash-halo,.glyph,.splash-welcome{animation:none!important;opacity:1!important;transform:none!important}
}

/* ---------- welcome gate (after sign-in) ---------- */
.welcome-gate{
  position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;background:var(--void);
  transition:opacity .6s ease,visibility .6s;
}
.welcome-gate.out{opacity:0;visibility:hidden}
.welcome-halo{
  position:absolute;width:min(84vw,420px);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(201,160,77,.26),rgba(201,160,77,.05) 48%,transparent 70%);
  animation:welcomeHalo 2.9s ease-in-out both;
}
@keyframes welcomeHalo{0%{opacity:0;transform:scale(.55)}45%{opacity:1;transform:scale(1)}100%{opacity:.85;transform:scale(1.1)}}
.welcome-mark{width:min(34vw,128px);color:var(--brand);animation:wcMark .95s cubic-bezier(.16,1,.3,1) both}
@keyframes wcMark{0%{opacity:0;transform:scale(.5) rotate(-14deg)}100%{opacity:1;transform:none}}
.welcome-copy{text-align:center;position:relative}
.wc-hi{display:block;font-size:13px;color:var(--ink-faint);letter-spacing:.16em;
  animation:welcomeIn .7s cubic-bezier(.16,1,.3,1) both .45s}
.wc-name{display:block;margin-top:6px;font-family:var(--font-display);font-weight:900;
  font-size:clamp(24px,6.4vw,36px);letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--brand) 10%,var(--brand-lift) 48%,var(--brand) 82%);
  -webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;
  animation:welcomeIn .8s cubic-bezier(.16,1,.3,1) both .6s, shimmer 2.6s ease-in-out infinite .6s}
.wc-role{display:block;margin-top:9px;font-size:13px;color:var(--ink-dim);
  animation:welcomeIn .7s cubic-bezier(.16,1,.3,1) both .78s}
.welcome-bar{width:150px;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;
  animation:welcomeIn .5s ease both .95s}
.welcome-bar i{display:block;height:100%;width:100%;border-radius:99px;transform-origin:0 50%;
  background:linear-gradient(90deg,var(--brand),var(--brand-lift));
  animation:wcFill 1.5s cubic-bezier(.4,0,.2,1) both .95s}
@keyframes wcFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wc-ready{font-size:11.5px;color:var(--ink-faint);letter-spacing:.1em;
  animation:welcomeIn .6s ease both 1.1s}
[dir="rtl"] .welcome-bar i{transform-origin:100% 50%}

/* ---------- logo ---------- */
.logo-mark,.logo-word,.logo-lock{display:block;fill:currentColor}
.logo-glow{filter:drop-shadow(0 0 22px rgba(201,160,77,.5))}

/* ---------- app shell ---------- */
#app{position:relative;z-index:1;min-height:100%;display:flex}
.sidebar{
  width:252px;flex:none;position:fixed;inset-block:0;inset-inline-start:0;z-index:30;
  display:flex;flex-direction:column;gap:26px;padding:24px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-inline-end:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 0}
.brand .logo-mark{width:42px;color:var(--brand)}
.brand-text{display:flex;flex-direction:column;gap:3px;line-height:1}
.brand-text .logo-word{width:64px;color:var(--brand);opacity:.95}
.brand-text span{font-size:9.5px;color:var(--ink-faint);letter-spacing:.22em;text-transform:uppercase;font-weight:700}

.navlist{display:flex;flex-direction:column;gap:4px}
.navitem{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 14px;border:none;border-radius:13px;background:transparent;cursor:pointer;
  color:var(--ink-dim);font-size:13.5px;font-weight:700;text-align:start;
  transition:color .2s,background .2s,transform .15s;
}
.navitem svg{width:19px;height:19px;flex:none}
.navitem:hover{color:var(--ink);background:var(--surface)}
.navitem.active{
  color:#04211A;
  background:linear-gradient(135deg,var(--mint-2),var(--mint-deep));
  box-shadow:var(--glow-mint);
}
.navitem.active svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}

.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mini-toggle-row{display:flex;gap:7px}
.mini-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;
  border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-dim);font-size:11.5px;font-weight:800;cursor:pointer;transition:all .18s;
}
.mini-btn:hover{border-color:var(--line-bright);color:var(--ink)}
.mini-btn.on{background:rgba(0,230,162,.12);border-color:rgba(0,230,162,.4);color:var(--mint)}
.who-card{
  display:flex;align-items:center;gap:11px;padding:11px;border-radius:15px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);transition:all .18s;
}
.who-card:hover{border-color:var(--line-bright);background:var(--elev)}
.avatar{
  width:36px;height:36px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:14px;color:#04211A;
  background:linear-gradient(135deg,var(--mint-2),var(--mint-deep));
}
.who-text{overflow:hidden}
.who-text b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-text span{font-size:10.5px;color:var(--ink-faint)}

#main{flex:1;min-width:0;margin-inline-start:252px}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 30px;border-bottom:1px solid var(--line);
  background:rgba(6,7,11,.6);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
}
.topbar h2{font-size:19px;font-weight:800}
.topbar .sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px;letter-spacing:.01em}
.pulse{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--ink-dim);
  padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--surface);
}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
#view{padding:26px 30px 120px;max-width:1240px}

/* ---------- motion ---------- */
.fade-in{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) both}
.stagger>*:nth-child(1){animation-delay:.03s}
.stagger>*:nth-child(2){animation-delay:.09s}
.stagger>*:nth-child(3){animation-delay:.15s}
.stagger>*:nth-child(4){animation-delay:.21s}
.stagger>*:nth-child(5){animation-delay:.27s}
.stagger>*:nth-child(n+6){animation-delay:.32s}

/* ---------- KPI tiles ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:24px}
.kpi{
  position:relative;overflow:hidden;padding:20px;border-radius:var(--r);
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .25s;
}
.kpi::before{content:"";position:absolute;top:0;inset-inline:18px;height:1px;background:linear-gradient(90deg,transparent,var(--line-bright),transparent)}
@media (hover:hover){.kpi:hover{transform:translateY(-4px);border-color:var(--line-bright);box-shadow:var(--shadow-lg)}}
.kpi .lbl{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.kpi .lbl svg{width:14px;height:14px;flex:none}
.kpi .val{margin-top:12px;font-family:var(--font-mono);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi .val small{font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--ink-faint);margin-inline-start:4px}
.kpi .delta{margin-top:8px;font-size:11px;color:var(--ink-faint)}
.kpi.accent{border-color:rgba(0,230,162,.3);background:linear-gradient(160deg,rgba(0,230,162,.13),rgba(0,230,162,.02))}
.kpi.accent .val{color:var(--mint);text-shadow:0 0 28px rgba(0,230,162,.5)}
.kpi.accent .lbl{color:rgba(0,230,162,.75)}
.kpi.gold{border-color:rgba(255,196,107,.28);background:linear-gradient(160deg,rgba(255,196,107,.11),rgba(255,196,107,.02))}
.kpi.gold .val{color:var(--gold);text-shadow:0 0 28px rgba(255,196,107,.45)}
.kpi.gold .lbl{color:rgba(255,196,107,.75)}

.locked-note{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:13px;
  font-size:12.5px;font-weight:700;line-height:1.6;
  background:var(--rose-soft);color:var(--rose);border:1px solid rgba(255,107,107,.3)}

/* ---------- always-on totals strip ---------- */
.totals-strip{
  position:sticky;top:calc(66px + env(safe-area-inset-top,0px));z-index:18;
  display:flex;gap:10px;padding:12px 30px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:rgba(6,7,11,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);scrollbar-width:none;
}
.totals-strip::-webkit-scrollbar{display:none}
.tot{
  flex:none;min-width:124px;padding:10px 14px;border-radius:13px;
  border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
}
.tot span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.tot b{display:block;margin-top:5px;font-size:16px;font-weight:600;white-space:nowrap}
.tot b i{font-style:normal;font-size:10px;color:var(--ink-faint);font-family:var(--font-body)}
.tot.accent{border-color:rgba(0,230,162,.3);background:linear-gradient(160deg,rgba(0,230,162,.12),rgba(0,230,162,.02))}
.tot.accent b{color:var(--mint)}
.tot.warn{border-color:rgba(255,196,107,.3);background:linear-gradient(160deg,rgba(255,196,107,.1),rgba(255,196,107,.02))}
.tot.warn b{color:var(--gold)}
.tot.violet{border-color:rgba(139,123,255,.3);background:linear-gradient(160deg,rgba(139,123,255,.1),rgba(139,123,255,.02))}
.tot.violet b{color:var(--violet)}
@media(max-width:860px){
  .totals-strip{padding:10px 16px;gap:8px;top:calc(58px + env(safe-area-inset-top,0px))}
  .tot{min-width:112px;padding:9px 12px}
  .tot b{font-size:15px}
}

/* ---------- bill alert + rows ---------- */
.bill-alert{
  display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:16px 18px;
  border-radius:var(--r);cursor:pointer;border:1px solid transparent;
  transition:transform .2s,box-shadow .25s,border-color .2s;
}
.bill-alert:hover{transform:translateY(-2px)}
.bill-alert.danger{background:linear-gradient(135deg,rgba(255,107,107,.16),rgba(255,107,107,.05));
  border-color:rgba(255,107,107,.38);box-shadow:0 10px 36px -14px rgba(255,107,107,.65)}
.bill-alert.warn{background:linear-gradient(135deg,rgba(255,196,107,.15),rgba(255,196,107,.04));
  border-color:rgba(255,196,107,.35);box-shadow:0 10px 36px -14px rgba(255,196,107,.5)}
.bill-alert .ba-ic{flex:none;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.bill-alert.danger .ba-ic{background:rgba(255,107,107,.2);color:var(--rose);animation:alertPulse 1.9s ease-in-out infinite}
.bill-alert.warn .ba-ic{background:rgba(255,196,107,.2);color:var(--gold)}
@keyframes alertPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.45)}60%{box-shadow:0 0 0 12px rgba(255,107,107,0)}}
.bill-alert .ba-body{flex:1;min-width:0}
.bill-alert .ba-body b{display:block;font-size:14px}
.bill-alert.danger .ba-body b{color:var(--rose)}
.bill-alert.warn .ba-body b{color:var(--gold)}
.bill-alert .ba-body span{font-size:12px;color:var(--ink-dim)}
.bill-alert .ba-go{flex:none;font-size:11.5px;font-weight:800;color:var(--ink-dim);white-space:nowrap}
.bill-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.check-row{display:flex;align-items:center;gap:11px;margin:16px 0;cursor:pointer;
  font-size:13.5px;color:var(--ink-dim)}
.check-row input{width:19px;height:19px;accent-color:var(--mint);flex:none}
@media(max-width:620px){
  .bill-alert .ba-go{display:none}
  .bill-right .btn{padding:7px 11px;font-size:11.5px}
}

/* ---------- cards ---------- */
.card{
  position:relative;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.card::before{content:"";position:absolute;top:0;inset-inline:22px;height:1px;background:linear-gradient(90deg,transparent,var(--line-bright),transparent)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:15px;font-weight:800}
.card-body{padding:6px 20px 16px}
.section{margin-bottom:24px}
.section-title{margin:0 0 12px 2px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  padding:12px 18px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  font-size:13px;font-weight:800;transition:transform .14s,filter .2s,box-shadow .25s,background .2s;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--mint-2),var(--mint-deep));color:#04211A;box-shadow:var(--glow-mint)}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 0 0 1px rgba(0,230,162,.35),0 12px 48px -8px rgba(0,230,162,.6)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line-bright);background:var(--elev)}

.btn-block{width:100%}

.icon-btn{
  width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;

}

}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
.pill.pending{background:var(--gold-soft);color:var(--gold);border-color:rgba(255,196,107,.28)}
.pill.collected{background:var(--violet-soft);color:var(--violet);border-color:rgba(139,123,255,.3)}
.pill.confirmed{background:var(--mint-soft);color:var(--mint);border-color:rgba(0,230,162,.3)}
.pill.gap{background:var(--rose-soft);color:var(--rose);border-color:rgba(255,107,107,.3)}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;font-size:10.5px;font-weight:700;background:var(--surface);color:var(--ink-dim);border:1px solid var(--line)}
.chip.pos{background:rgba(139,123,255,.13);color:var(--violet);border-color:rgba(139,123,255,.25)}
.chip.cash{background:var(--mint-soft);color:var(--mint);border-color:rgba(0,230,162,.25)}
.chip.other{background:var(--gold-soft);color:var(--gold);border-color:rgba(255,196,107,.25)}
.chip.hospitality{background:var(--violet-soft);color:var(--violet);border-color:rgba(139,123,255,.3)}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);transition:background .18s}
.row:last-child{border-bottom:none}
.row .ricon{width:42px;height:42px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-dim)}
.row .ricon svg{width:18px;height:18px}
.row .rmain{flex:1;min-width:0}
.row .rmain b{display:block;font-size:13.5px;font-weight:700}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:4px;font-size:11px;color:var(--ink-faint)}
.row .ramt{flex:none;font-family:var(--font-mono);font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}

.empty span{font-size:12px}

/* ============ APPROVAL FLOW — the centrepiece ============ */
.flow{position:relative;display:flex;padding:30px 6px 8px}
.flow-step{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.flow-track{position:absolute;top:27px;inset-inline-start:-50%;width:100%;height:3px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.flow-step:first-child .flow-track{display:none}
.flow-track.filled{background:linear-gradient(90deg,var(--mint-deep),var(--mint))}
.flow-track.filled::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  animation:trackFlow 2.4s ease-in-out infinite;
}
@keyframes trackFlow{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.flow-node{
  position:relative;z-index:2;width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--void-2);border:2px solid rgba(255,255,255,.12);color:var(--ink-faint);
  transition:all .45s cubic-bezier(.34,1.56,.64,1);
}
.flow-node svg{width:21px;height:21px}
.flow-step.done .flow-node{
  background:linear-gradient(135deg,var(--mint-2),var(--mint-deep));border-color:transparent;color:#04211A;
  box-shadow:0 0 0 5px rgba(0,230,162,.12),0 10px 34px -6px rgba(0,230,162,.7);
}
.flow-step.done .flow-node svg{animation:nodePop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes nodePop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.flow-step.active .flow-node{border-color:var(--gold);color:var(--gold);animation:nodeRing 2.1s ease-in-out infinite}
@keyframes nodeRing{0%,100%{box-shadow:0 0 0 0 rgba(255,196,107,.42)}55%{box-shadow:0 0 0 13px rgba(255,196,107,0)}}
.flow-label{margin-top:12px;font-size:11.5px;font-weight:800;color:var(--ink-dim)}
.flow-step.done .flow-label,.flow-step.active .flow-label{color:var(--ink)}
.flow-who{margin-top:3px;font-size:10.5px;color:var(--ink-faint)}
.flow-amt{margin-top:7px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.flow-step.done .flow-amt{color:var(--mint)}
.flow-time{margin-top:2px;font-size:9.5px;color:var(--ink-faint);letter-spacing:.02em}

.ho-card{position:relative;overflow:hidden;padding:20px}
.ho-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.ho-branch{font-size:15.5px;font-weight:800}
.ho-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.ho-sum div span{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.ho-sum div b{font-family:var(--font-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.ho-sum div b.mint{color:var(--mint)}
.ho-sum div b.rose{color:var(--rose)}

/* ---------- forms ---------- */
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:7px;font-size:11.5px;font-weight:700;color:var(--ink-dim);letter-spacing:.02em}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=date],.field select,.field textarea{
  width:100%;padding:13px 14px;border-radius:13px;font-size:14px;font-family:inherit;
  background:rgba(255,255,255,.04);border:1.5px solid var(--line);color:var(--ink);
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-faint)}
.field input:focus,.field select:focus,.field textarea:focus{

  box-shadow:0 0 0 4px rgba(0,230,162,.12);
}

  background-repeat:no-repeat;background-size:17px 17px;background-position:right 15px center;
}
[dir="rtl"] .field select{background-position:left 15px center}
.field select option{background:var(--surface-solid);color:var(--ink)}
.field textarea{min-height:70px;resize:vertical}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-opt{
  flex:1;min-width:92px;padding:13px 9px;border-radius:13px;cursor:pointer;text-align:center;
  font-size:12.5px;font-weight:700;color:var(--ink-dim);
  background:rgba(255,255,255,.03);border:1.5px solid var(--line);transition:all .2s;
}
.seg-opt:hover{border-color:var(--line-bright);color:var(--ink)}
.seg-opt.sel{border-color:var(--mint);background:var(--mint-soft);color:var(--mint);box-shadow:0 0 0 3px rgba(0,230,162,.1)}
.amt-input{position:relative}
.amt-input input{font-family:var(--font-mono);font-size:26px;font-weight:600;padding-inline-end:62px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amt-input .cur{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:var(--ink-faint)}
.upload-box{padding:18px;border-radius:13px;border:1.5px dashed var(--line-bright);text-align:center;cursor:pointer;color:var(--ink-faint);font-size:12px;font-weight:700;transition:all .2s}
.upload-box:hover{border-color:var(--mint);color:var(--mint);background:var(--mint-soft)}
.upload-preview{display:flex;align-items:center;gap:12px;padding:10px;border-radius:13px;border:1px solid var(--line);background:var(--surface)}
.upload-preview img{width:46px;height:46px;border-radius:10px;object-fit:cover}
.hint{margin-top:6px;font-size:11px;color:var(--ink-faint);line-height:1.6}

/* ---------- sheet / modal / toast ---------- */
#overlay{position:fixed;inset:0;z-index:100;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(3,4,7,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s;pointer-events:auto}
.scrim.show{opacity:1}
.sheet{
  position:absolute;inset-inline:0;bottom:0;max-height:88dvh;overflow-y:auto;pointer-events:auto;
  border-radius:26px 26px 0 0;border-top:1px solid var(--line-bright);
  background:linear-gradient(180deg,#141722,#0B0D13);
  box-shadow:var(--shadow-lg);
  transform:translateY(100%);transition:transform .38s cubic-bezier(.16,1,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet.show{transform:none}
.sheet-handle{width:40px;height:4px;margin:12px auto;border-radius:99px;background:var(--line-bright)}
/* Keep the confirm action reachable no matter how long the form gets. */
.sheet form>.btn-block:last-child,
.sheet .sheet-body>.btn-block:last-child{

  box-shadow:0 -14px 22px -6px #0B0D13, var(--glow-mint);
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 22px 14px}

.sheet-body{padding:4px 22px 26px}
@media(min-width:640px){

    border-radius:24px;border:1px solid var(--line-bright);max-height:86dvh;
    opacity:0;transform:translateY(-46%) scale(.95)}
  .sheet.show{opacity:1;transform:translateY(-50%) scale(1)}
}
.toaster{position:fixed;inset-inline:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
@media(min-width:861px){.toaster{inset-inline:auto;inset-inline-end:28px;bottom:28px;align-items:flex-end}}
.toast{
  display:flex;align-items:center;gap:11px;max-width:350px;padding:14px 18px;border-radius:15px;
  font-size:13px;font-weight:700;color:var(--ink);
  background:linear-gradient(135deg,#171B26,#0E1118);border:1px solid var(--line-bright);
  box-shadow:var(--shadow-lg);animation:toastIn .45s cubic-bezier(.34,1.56,.64,1) both;
}

.confirm-box{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(3,4,7,.6);backdrop-filter:blur(4px)}

/* ---------- login ---------- */
.login-wrap{position:relative;z-index:1;min-height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;padding:28px 20px}

/* ---- Splash lockup: the same official artwork, split so each glyph of the
   mark and each letter of WINS can fade in and out on its own timeline.
   The paths themselves are untouched. ---- */
function splitPaths(str){ return str.match(/<path[^>]*\/>/g) || []; }
/* Mark glyphs run right-to-left, matching how ونس reads. */
var MARK_ORDER = [0,1,2,3];
/* WINS letters: W is three strokes, I one, N two, S three. */
var WORD_LETTERS = [[4,3,6],[2],[0,5],[1,7,8]];

function splashLockup(){
  var marks = splitPaths(LOGO_MARK_PATHS);
  var words = splitPaths(LOGO_WORD_PATHS);
  var markSvg = MARK_ORDER.map(function(idx,i){
    return '<g class="glyph" style="--din:'+(0.15+i*0.20).toFixed(2)+'s;--dout:'+(4.30-i*0.07).toFixed(2)+'s">'+(marks[idx]||'')+'</g>';
  }).join('');
  var wordSvg = WORD_LETTERS.map(function(group,i){
    return '<g class="glyph" style="--din:'+(1.05+i*0.18).toFixed(2)+'s;--dout:'+(4.00+i*0.07).toFixed(2)+'s">'+
      group.map(function(idx){ return words[idx]||''; }).join('')+'</g>';
  }).join('');
  return '<svg class="boot-logo logo-glow" viewBox="167 88 242 84" xmlns="http://www.w3.org/2000/svg" aria-label="WINS"><g fill="currentColor">'+markSvg+'</g></svg>'+
         '<svg class="boot-word" viewBox="194 171 180 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="currentColor">'+wordSvg+'</g></svg>'+
         '<div class="splash-welcome"><b>'+t('welcomeTitle')+'</b><span>'+t('welcomeKicker')+'</span></div>'+
         '<div class="splash-halo"></div>';
}

var Store = (function(){
  var mode='local', dbns=null, assetsns=null;
  var LS_KEY='wins_cash_local_v1';
  var API_KEY='wins_api_url';
  var COLS=['cities','branches','staff','sales','expenses','handovers','editRequests','bills'];
  var local=null;
  var listeners={}; // path -> [cb]
  var apiUrl=null, pollTimer=null, lastSig='', pendingPush=[], pushing=false;

  /* ---- Google Sheets backend -------------------------------------------
     The endpoint URL is never committed to the repository: it is supplied
     once per device, either by pasting it in Admin > Integration or by
     opening the app with ?api=<url>, and then kept in localStorage. */
  function readApiUrl(){
    try{
      var q=new URLSearchParams(location.search).get('api');
      if(q){ localStorage.setItem(API_KEY, q); history.replaceState({},'',location.pathname); return q; }
      return localStorage.getItem(API_KEY)||null;
    }catch(e){ return null; }
  }
  function setApiUrl(u){
    apiUrl=u||null;
    try{ u ? localStorage.setItem(API_KEY,u) : localStorage.removeItem(API_KEY); }catch(e){}
  }
  function blankDb(){ var o={}; COLS.forEach(function(c){ o[c]={}; }); return o; }
  async function apiGet(url){
    var r=await fetch(url,{method:'GET',redirect:'follow'});
    var j=await r.json();
    if(!j||!j.ok) throw new Error((j&&j.error)||'bad response');
    return j.data;
  }
  /* text/plain keeps this a "simple" request: Apps Script cannot answer the
     CORS preflight that application/json would trigger. */
  async function apiPost(body){
    return fetch(apiUrl,{
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body)
    });
  }
  function queuePush(op,col,id,data){
    if(mode!=='sheets') return;
    pendingPush.push({op:op,collection:col,id:id,data:data});
    flushPush();
  }
  async function flushPush(){
    if(pushing||!pendingPush.length||!apiUrl) return;
    pushing=true;
    var batch=pendingPush.splice(0,20);
    try{ await apiPost({op:'batch',writes:batch}); }
    catch(e){ pendingPush=batch.concat(pendingPush); } // keep for the next attempt
    finally{ pushing=false; if(pendingPush.length) setTimeout(flushPush,1500); }
  }
  function signature(db){
    var n=''; COLS.forEach(function(c){ n+=c+':'+Object.keys(db[c]||{}).length+';'; });
    return n+JSON.stringify(db).length;
  }
  async function pollOnce(){
    if(mode!=='sheets'||pendingPush.length||pushing) return;
    try{
      var fresh=await apiGet(apiUrl);
      COLS.forEach(function(c){ if(!fresh[c]) fresh[c]={}; });
      var sig=signature(fresh);
      if(sig!==lastSig){ lastSig=sig; local=fresh; saveLocal(); COLS.forEach(emit); }
    }catch(e){ /* stay on the cached copy until the network returns */ }
  }

      if(!apiUrl) throw new Error('no endpoint');
      var writes=[];
      COLS.forEach(function(c){
        Object.keys(local[c]||{}).forEach(function(id){
          writes.push({op:'set',collection:c,id:id,data:local[c][id]});
        });
      });
      for(var i=0;i<writes.length;i+=14){
        await apiPost({op:'batch',writes:writes.slice(i,i+14)});
      }
      return writes.length;
    },
    syncNow:pollOnce,
    onCollection(col, cb){
      if(mode==='db'){
        return dbns.collection(col).onSnapshot(function(snap){
          var out={};
          snap.docs.forEach(function(d){ out[d.id]=d.data(); });
          cb(out);
        }, function(err){ console.warn('db err',col,err); });
      } else {
        listeners[col]=listeners[col]||[];
        var fn=function(){ cb(Object.assign({},local[col])); };
        listeners[col].push(fn);
        setTimeout(fn,0);
        return function(){ listeners[col]=listeners[col].filter(function(x){return x!==fn;}); };
      }
    },
    async add(col, data){
      if(mode==='db'){
        var ref = await dbns.collection(col).add(data);
        return ref.id;
      } else {
        var id=genId();
        local[col][id]=data;
        saveLocal(); emit(col); queuePush('set',col,id,data);
        return id;
      }
    },
    async set(col,id,data){
      if(mode==='db'){ await dbns.doc(col+'/'+id).set(data); }
      else { local[col][id]=data; saveLocal(); emit(col); queuePush('set',col,id,data); }
    },
    async update(col,id,data){
      if(mode==='db'){ await dbns.doc(col+'/'+id).update(data); }
      else { local[col][id]=Object.assign({},local[col][id]||{},data); saveLocal(); emit(col); queuePush('set',col,id,local[col][id]); }
    },
    async uploadAsset(file){
      if(mode==='db' && assetsns){
        var r = await assetsns.upload(file);
        return {id:r.id, url:r.url};
      }
      return new Promise(function(resolve){
        var reader=new FileReader();
        reader.onload=function(){ resolve({id:null,url:reader.result}); };
        reader.readAsDataURL(file);
      });
    }
  };
  return api;
})();

/* ===================== ANIMATED COUNTER ===================== */
function animateValue(el,to){
  if(!el) return;
  var from=0, dur=750, start=null;
  function step(ts){
    if(!start) start=ts;
    var p=Math.min(1,(ts-start)/dur);
    var eased=1-Math.pow(1-p,3);
    el.textContent=fmtMoney(from+(to-from)*eased);
    if(p<1) requestAnimationFrame(step);
    else el.textContent=fmtMoney(to);
  }
  requestAnimationFrame(step);
}

/* ===================== DERIVED DATA HELPERS ===================== */
function branchesInCity(cityId){ return Object.keys(STATE.data.branches).filter(function(id){return STATE.data.branches[id].cityId===cityId;}); }
function allBranchIds(){ return Object.keys(STATE.data.branches); }
function normName(s){ return (s||'').trim().toLowerCase(); }
function branchesForArea(areaManagerName){ return allBranchIds().filter(function(id){ return normName(STATE.data.branches[id].areaManagerName)===normName(areaManagerName); }); }
function branchesForCollector(collectorName){ return allBranchIds().filter(function(id){ return normName(STATE.data.branches[id].collectorName)===normName(collectorName); }); }
function scopeToMyCollectorBranches(handovers){
  var mine=branchesForCollector(STATE.session.name);
  if(!mine.length) return handovers;
  return handovers.filter(function(h){ return mine.indexOf(h.branchId)>-1; });
}
function salesFor(branchId,period){
  return Object.keys(STATE.data.sales).map(function(id){ return Object.assign({id:id},STATE.data.sales[id]); })
    .filter(function(s){ return (!branchId||s.branchId===branchId) && inPeriod(s.createdAt,period); });
}
function expensesFor(branchId,period){
  return Object.keys(STATE.data.expenses).map(function(id){ return Object.assign({id:id},STATE.data.expenses[id]); })
    .filter(function(e){ return (!branchId||e.branchId===branchId) && inPeriod(e.createdAt,period); });
}
function handoversFor(branchId){
  return Object.keys(STATE.data.handovers).map(function(id){ return Object.assign({id:id},STATE.data.handovers[id]); })
    .filter(function(h){ return !branchId||h.branchId===branchId; })
    .sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); });
}
function inPeriod(iso,period){
  if(!period||period==='all') return true;
  var d=new Date(iso), now=new Date();
  if(period==='today') return d.toDateString()===now.toDateString();
  if(period==='week'){ var wk=7*24*3600000; return (now-d)<wk; }
  return true;
}
function cashOnHand(branchId){
  var cash=salesFor(branchId,'all').filter(function(s){return s.type==='cash';}).reduce(function(a,s){return a+Number(s.amount||0);},0);
  var exp=expensesFor(branchId,'all').reduce(function(a,e){return a+Number(e.amount||0);},0);
  var handed=handoversFor(branchId).reduce(function(a,h){return a+Number(h.declaredAmount||0);},0);
  return cash-exp-handed;
}
function sumSalesByType(branchId,period,type){
  return salesFor(branchId,period).filter(function(s){
    return type ? s.type===type : REVENUE_TYPES.indexOf(s.type)>-1;
  }).reduce(function(a,s){return a+Number(s.amount||0);},0);
}
function sumExpenses(branchId,period){ return expensesFor(branchId,period).reduce(function(a,e){return a+Number(e.amount||0);},0); }
/* Treasury/accountant petty cash: cash confirmed into the treasury, minus what the
   accountant has spent from it. Branch expenses never touch this figure. */
function treasuryExpenses(period){
  return Object.keys(STATE.data.expenses).map(function(id){ return Object.assign({id:id},STATE.data.expenses[id]); })
    .filter(function(e){ return e.scope==='treasury' && inPeriod(e.createdAt,period); });
}
function treasuryInflow(){
  return Object.keys(STATE.data.handovers).map(function(id){ return STATE.data.handovers[id]; })
    .filter(function(h){ return h.status==='confirmed'; })
    .reduce(function(a,h){ return a+Number(h.confirmedAmount||0); },0);
}
function treasuryPettyCash(){
  return treasuryInflow() - treasuryExpenses('all').reduce(function(a,e){ return a+Number(e.amount||0); },0);
}

/* ===================== ALWAYS-ON TOTALS STRIP =====================
   A sticky summary under the app bar, shown on every tab for every role, so
   the figure that matters is never more than a glance away. */
function totalItem(label,value,cls,isCount){
  return '<div class="tot '+(cls||'')+'">'+
    '<span>'+label+'</span>'+
    '<b class="mono">'+(isCount?value:fmtMoney(value))+(isCount?'':' <i>'+t('sar')+'</i>')+'</b>'+
  '</div>';
}
function totalsStrip(){
  if(!STATE.session) return '';
  var r=STATE.session.role, out='';
  var unpaidBills=billsFor().filter(function(b){return b.status!=='paid';})
      .reduce(function(a,b){return a+Number(b.amount||0);},0);

  if(r==='manager'){
    var b=STATE.session.branchId;
    out= totalItem(t('cashOnHand'), cashOnHand(b), 'accent')
       + totalItem(t('totRevenue'), sumSalesByType(b,'today',null))
       + totalItem(t('todayExpenses'), sumExpenses(b,'today'))
       + totalItem(t('totHospitality'), sumSalesByType(b,'today','hospitality'), 'violet')
       + totalItem(t('totUnpaidBills'), unpaidBills, unpaidBills>0?'warn':'');
  } else if(r==='collector'){
    var pend=scopeToMyCollectorBranches(handoversFor(null).filter(function(h){return h.status==='pending';}));
    var held=handoversFor(null).filter(function(h){return h.status==='collected' && h.collectorId===STATE.session.id;});
    out= totalItem(t('pendingPickups'), pend.length, 'warn', true)
       + totalItem(t('totToCollect'), pend.reduce(function(a,h){return a+Number(h.declaredAmount||0);},0), 'accent')
       + totalItem(t('totAwaiting'), held.reduce(function(a,h){return a+Number(h.collectedAmount||0);},0));
  } else if(r==='treasury'){
    var col=handoversFor(null).filter(function(h){return h.status==='collected';});
    out= totalItem(t('pettyCash'), treasuryPettyCash(), 'accent')
       + totalItem(t('totAwaiting'), col.reduce(function(a,h){return a+Number(h.collectedAmount||0);},0), 'warn')
       + totalItem(t('networkConfirmed'), treasuryInflow())
       + totalItem(t('totUnpaidBills'), unpaidBills, unpaidBills>0?'warn':'');
  } else if(r==='area'){
    var mine=branchesForArea(STATE.session.name); if(!mine.length) mine=allBranchIds();
    out= totalItem(t('myBranches'), mine.length, '', true)
       + totalItem(t('totRevenue'), mine.reduce(function(a,id){return a+sumSalesByType(id,'today',null);},0))
       + totalItem(t('cashOnHand'), mine.reduce(function(a,id){return a+cashOnHand(id);},0), 'accent')
       + totalItem(t('todayExpenses'), mine.reduce(function(a,id){return a+sumExpenses(id,'today');},0));
  } else {
    var transit=Object.keys(STATE.data.handovers).map(function(id){return STATE.data.handovers[id];})
      .filter(function(h){return h.status!=='confirmed';})
      .reduce(function(a,h){return a+Number(h.declaredAmount||0);},0);
    out= totalItem(t('totBranches'), allBranchIds().length, '', true)
       + totalItem(t('totNetwork'), sumSalesByType(null,'today',null), 'accent')
       + totalItem(t('networkCashTransit'), transit, 'warn')
       + totalItem(t('networkConfirmed'), treasuryInflow())
       + totalItem(t('totUnpaidBills'), unpaidBills, unpaidBills>0?'warn':'');
  }
  return '<div class="totals-strip">'+out+'</div>';
}

        '<td class="mono">'+fmtMoney(r.s)+'</td>'+

        '<td class="mono">'+fmtMoney(r.e)+'</td>'+

function flowHtml(h){
  var step = h.status==='pending'?0 : h.status==='collected'?1 : 2;
  var steps=[
    {label:t('stepDeclared'), who:h.managerName, amt:h.declaredAmount, at:h.createdAt, ic:'building'},
    {label:t('stepCollected'), who:h.collectorName, amt:h.collectedAmount, at:h.collectedAt, ic:'truck'},
    {label:t('stepConfirmed'), who:h.treasuryName, amt:h.confirmedAmount, at:h.confirmedAt, ic:'bank'}
  ];
  return '<div class="flow">'+steps.map(function(s,i){
    var cls = i<=step-1 ? 'done' : (i===step ? (step===2?'done':'active') : '');
    if(i===0) cls='done';
    var reached = (i<step) || (i===0) || (step===2);
    return '<div class="flow-step '+cls+'">'+
      '<div class="flow-track'+(i<=step && i>0 ? ' filled':'')+'"></div>'+
      '<div class="flow-node">'+(reached?icon('check'):icon(s.ic))+'</div>'+
      '<div class="flow-label">'+s.label+'</div>'+
      '<div class="flow-who">'+esc(s.who||'—')+'</div>'+
      (s.amt!=null&&s.amt!==''?'<div class="flow-amt">'+fmtMoney(s.amt)+'</div>':'')+
      (s.at?'<div class="flow-time">'+fmtDate(s.at)+'</div>':'')+
    '</div>';
  }).join('')+'</div>';
}
function handoverCard(role,h){
  var pillCls=h.status, pillLabel=t('status'+cap(h.status));
  var gap = (h.status!=='pending' && Number(h.collectedAmount)!==Number(h.declaredAmount));
  var diff = Number(h.collectedAmount||0)-Number(h.declaredAmount||0);
  var actions='';
  /* Segregation of duties: nobody may approve a stage of a handover they
     already acted on. Several people hold more than one role (Sobhy is admin,
     treasury and a branch manager), so without this a person could declare
     cash and then confirm its receipt themselves — which defeats the chain. */
  var selfDeclared = h.managerId===STATE.session.id;
  var selfCollected = h.collectorId===STATE.session.id;
  if(role==='collector' && h.status==='pending'){
    actions = selfDeclared
      ? '<div class="locked-note">'+icon('alert','ic-s')+' '+t('cannotSelfApprove')+'</div>'
      : '<button class="btn btn-primary btn-block" data-action="open-collect" data-id="'+h.id+'">'+icon('check')+t('collectBtn')+'</button>';
  }
  if(role==='treasury' && h.status==='collected'){
    actions = (selfDeclared||selfCollected)
      ? '<div class="locked-note">'+icon('alert','ic-s')+' '+t('cannotSelfApprove')+'</div>'
      : '<button class="btn btn-primary btn-block" data-action="open-confirm-receipt" data-id="'+h.id+'">'+icon('check')+t('confirmReceiptBtn')+'</button>';
  }
  return '<div class="card section ho-card">'+
    '<div class="ho-head">'+
      '<div><div class="ho-branch">'+branchName(h.branchId)+'</div><div class="hint">'+cityName((STATE.data.branches[h.branchId]||{}).cityId)+' · '+fmtDate(h.createdAt)+'</div></div>'+
      '<div style="text-align:end;display:flex;flex-direction:column;gap:5px;align-items:flex-end">'+
        '<div class="pill '+pillCls+'">'+pillLabel+'</div>'+
        (gap?'<div class="pill gap">'+icon('alert','ic-s')+' '+t('gapFlag')+' '+(diff>0?'+':'')+fmtMoney(diff)+'</div>':'')+
      '</div>'+
    '</div>'+
    flowHtml(h)+
    '<div class="ho-sum">'+
      '<div><span>'+t('declaredAmount')+'</span><b>'+fmtMoney(h.declaredAmount)+'</b></div>'+
      (h.status!=='pending'?'<div><span>'+t('receivedAmount')+'</span><b class="'+(gap?'rose':'')+'">'+fmtMoney(h.collectedAmount)+'</b></div>':'')+
      (h.status==='confirmed'?'<div><span>'+t('finalAmount')+'</span><b class="mint">'+fmtMoney(h.confirmedAmount)+'</b></div>':'')+
    '</div>'+
    (actions?'<div style="margin-top:16px">'+actions+'</div>':'')+
  '</div>';
}

/* ===================== BILLS (recurring utilities) =====================
   Tracks anything that arrives as a monthly invoice — electricity, internet,
   water, rent — so a due date is never missed and a service is never cut. */
function dayStart(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function daysUntil(dateStr){
  if(!dateStr) return null;
  return Math.round((dayStart(dateStr)-dayStart(new Date()))/86400000);
}
function fmtDay(iso){
  try{ return new Date(iso).toLocaleDateString(STATE.lang==='ar'?'ar-SA-u-nu-latn':'en-GB',
        {day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return iso||''; }
}
function billUrgency(b){
  if(b.status==='paid') return {key:'paid', cls:'confirmed', rank:4};
  var d=daysUntil(b.dueDate);
  if(d===null) return {key:'upcoming', cls:'pending', rank:3};
  if(d<0)  return {key:'overdue',  cls:'gap',       rank:0, days:Math.abs(d)};
  if(d<=3) return {key:'critical', cls:'gap',       rank:1, days:d};
  if(d<=7) return {key:'soon',     cls:'pending',   rank:2, days:d};
  return {key:'upcoming', cls:'collected', rank:3, days:d};
}
function billDueLabel(b){
  if(b.status==='paid') return t('paidOn')+' '+fmtDay(b.paidAt||b.dueDate);
  var d=daysUntil(b.dueDate);
  if(d===null) return '';
  if(d<0)   return t('overdueByDays').replace('{n}', Math.abs(d));
  if(d===0) return t('dueToday');
  if(d===1) return t('dueTomorrow');
  return t('dueInDays').replace('{n}', d);
}
function catIcon(list,id){
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i].ic||'expenses'; }
  return 'expenses';
}
/* Branch managers see their own branch; treasury, admin and area managers
   see every branch they are responsible for. */
function billsScope(){
  var r=STATE.session.role;
  if(r==='manager') return [STATE.session.branchId];
  if(r==='area'){ var mine=branchesForArea(STATE.session.name); return mine.length?mine:allBranchIds(); }
  return allBranchIds();
}
function billsFor(){
  var scope=billsScope();
  return Object.keys(STATE.data.bills||{})
    .map(function(id){ return Object.assign({id:id}, STATE.data.bills[id]); })
    .filter(function(b){ return scope.indexOf(b.branchId)>-1; })
    .sort(function(a,b){
      var ua=billUrgency(a), ub=billUrgency(b);
      if(ua.rank!==ub.rank) return ua.rank-ub.rank;
      return new Date(a.dueDate||0)-new Date(b.dueDate||0);
    });
}
function billsNeedingAttention(){
  return billsFor().filter(function(b){
    var k=billUrgency(b).key; return k==='overdue'||k==='critical'||k==='soon';
  });
}
function billAlertCard(){
  var urgent=billsNeedingAttention();
  if(!urgent.length) return '';
  var worst=billUrgency(urgent[0]);
  var cls=(worst.key==='overdue'||worst.key==='critical')?'danger':'warn';
  return '<div class="bill-alert '+cls+' fade-in" data-action="nav" data-tab="bills">'+
    '<div class="ba-ic">'+icon('alert','ic-s')+'</div>'+
    '<div class="ba-body"><b>'+(worst.key==='overdue'?t('cutoffRisk'):t('billsDueSoonTitle'))+'</b>'+
      '<span>'+t('billsAlertBody').replace('{n}',urgent.length)+'</span></div>'+
    '<div class="ba-go">'+t('openBills')+'</div></div>';
}
function billRow(b){
  var u=billUrgency(b);
  var canPay=b.status!=='paid' && ['manager','treasury','admin'].indexOf(STATE.session.role)>-1;
  return '<div class="row bill-row">'+
    '<div class="ricon">'+icon(catIcon(BILL_TYPES,b.type),'')+'</div>'+
    '<div class="rmain"><b>'+catLabel(BILL_TYPES,b.type)+(b.provider?' · '+esc(b.provider):'')+'</b>'+
      '<div class="rmeta"><span class="pill '+u.cls+'">'+billDueLabel(b)+'</span>'+
      '<span>'+branchName(b.branchId)+'</span>'+
      (b.accountNo?'<span>· '+esc(b.accountNo)+'</span>':'')+'</div></div>'+
    '<div class="bill-right">'+
      '<div class="ramt '+(b.status==='paid'?'pos':'neg')+'">'+fmtMoney(b.status==='paid'?(b.paidAmount||b.amount):b.amount)+'</div>'+
      (canPay?'<button class="btn btn-primary btn-sm" data-action="open-pay-bill" data-id="'+b.id+'">'+t('markPaid')+'</button>':'')+
    '</div></div>';
}
function renderBills(){
  var all=billsFor();
  var overdue=all.filter(function(b){ return billUrgency(b).key==='overdue'; });
  var urgent=billsNeedingAttention();
  var unpaidTotal=all.filter(function(b){ return b.status!=='paid'; })
                     .reduce(function(a,b){ return a+Number(b.amount||0); },0);
  var html='<div class="kpi-grid stagger">'+
    kpi(t('billsOverdueTitle'), overdue.length, 'gold', null, true)+
    kpi(t('billsDueSoonTitle'), urgent.length, '', null, true)+
    kpi(t('statusUnpaid'), unpaidTotal, 'accent', t('sar'))+
  '</div>';
  var canAdd=['manager','treasury','admin'].indexOf(STATE.session.role)>-1;
  html+='<div class="section"><div class="card"><div class="card-head"><h3>'+t('billsTitle')+'</h3>'+
    (canAdd?'<button class="btn btn-primary btn-sm" data-action="open-bill">'+icon('plus')+t('addBill')+'</button>':'')+
    '</div><div class="card-body">';
  if(!all.length){
    html+=emptyState('expenses',t('noBills'),t('noBillsSub'));
  } else {
    var groups=[
      [t('billsOverdueTitle'), function(k){ return k==='overdue'; }],
      [t('billsDueSoonTitle'), function(k){ return k==='critical'||k==='soon'; }],
      [t('billsUpcoming'),     function(k){ return k==='upcoming'; }],
      [t('billsPaid'),         function(k){ return k==='paid'; }]
    ];
    groups.forEach(function(g){
      var rows=all.filter(function(b){ return g[1](billUrgency(b).key); });
      if(!rows.length) return;
      html+='<div class="section-title" style="margin:16px 0 2px">'+g[0]+' ('+rows.length+')</div>'+
        rows.map(billRow).join('');
    });
  }
  html+='</div></div></div>';
  if(canAdd) html+='<button class="fab" data-action="open-bill">'+icon('plus')+'</button>';
  return html;
}

function openPayBillSheet(id){
  var b=STATE.data.bills[id]; if(!b) return;
  var body='<div class="field"><label>'+catLabel(BILL_TYPES,b.type)+' · '+branchName(b.branchId)+'</label>'+
      '<div class="hint">'+t('dueDate')+': '+fmtDay(b.dueDate)+' — '+billDueLabel(b)+'</div></div>'+
    '<div class="field"><label>'+t('paidAmount')+'</label><div class="amt-input"><input type="number" step="0.01" min="0" id="pay-amt" value="'+(b.amount||0)+'"><span class="cur">'+t('sar')+'</span></div></div>'+
    '<div class="field"><label>'+t('payMethod')+'</label><div class="seg" id="pay-seg">'+
      '<div class="seg-opt sel" data-val="cash">'+t('payCash')+'</div>'+
      '<div class="seg-opt" data-val="bank">'+t('payBank')+'</div></div></div>'+
    '<label class="check-row"><input type="checkbox" id="pay-next" checked> <span>'+t('createNext')+'</span></label>'+
    '<button class="btn btn-primary btn-block" id="pay-submit">'+icon('check')+t('markPaid')+'</button>';
  openSheet(t('markPaid'),body,function(overlay){
    var method='cash';
    overlay.querySelectorAll('#pay-seg .seg-opt').forEach(function(opt){
      opt.onclick=function(){
        overlay.querySelectorAll('#pay-seg .seg-opt').forEach(function(o){ o.classList.remove('sel'); });
        opt.classList.add('sel'); method=opt.getAttribute('data-val');
      };
    });
    overlay.querySelector('#pay-submit').onclick=async function(){
      var amt=Number(overlay.querySelector('#pay-amt').value);
      if(!amt||amt<=0){ toast(t('errFill'),'err'); return; }
      var now=new Date().toISOString();
      await Store.update('bills',id,{status:'paid',paidAmount:amt,paidMethod:method,
        paidAt:now,paidBy:STATE.session.id,paidByName:STATE.session.name});
      /* Paying in cash leaves the branch drawer, so it must also land as an
         expense. A bank transfer never touches branch cash. */
      if(method==='cash'){
        await Store.add('expenses',{branchId:b.branchId,scope:'branch',category:'utilities',
          amount:amt,note:t('billOf')+' · '+catLabel(BILL_TYPES,b.type)+(b.provider?' · '+b.provider:''),
          staffId:STATE.session.id,staffName:STATE.session.name,
          createdAt:now,dateKey:now.slice(0,10),billId:id});
      }
      if(overlay.querySelector('#pay-next').checked){
        var nxt=new Date(b.dueDate); nxt.setMonth(nxt.getMonth()+1);
        await Store.add('bills',{branchId:b.branchId,type:b.type,provider:b.provider||'',
          accountNo:b.accountNo||'',amount:b.amount||amt,issueDate:null,
          dueDate:nxt.toISOString().slice(0,10),note:'',status:'unpaid',
          createdBy:STATE.session.id,createdByName:STATE.session.name,createdAt:now});
      }
      closeSheet(); toast(t('billPaid'));
    };
  });
}

/* ===================== SHEET / MODAL SYSTEM ===================== */
function openSheet(title, bodyHtml, onMount){
  var overlay=document.getElementById('overlay');
  overlay.innerHTML='<div class="scrim" data-action="close-sheet"></div><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><h3>'+title+'</h3><button class="icon-btn" data-action="close-sheet">'+icon('x')+'</button></div><div class="sheet-body">'+bodyHtml+'</div></div>';
  overlay.style.pointerEvents='auto';
  // Reveal synchronously after forcing a reflow. Never gate this on
  // requestAnimationFrame: browsers throttle it, and a sheet that misses the
  // frame stays parked off-screen with its submit button under the nav bar.
  var sc=overlay.querySelector('.scrim'), sh=overlay.querySelector('.sheet');
  if(sh) void sh.offsetWidth;
  if(sc) sc.classList.add('show');
  if(sh) sh.classList.add('show');
  if(onMount) onMount(overlay);
}
function closeSheet(){
  var overlay=document.getElementById('overlay');
  var scrim=overlay.querySelector('.scrim'), sheet=overlay.querySelector('.sheet');
  if(scrim) scrim.classList.remove('show');
  if(sheet) sheet.classList.remove('show');
  overlay.style.pointerEvents='none';
  setTimeout(function(){ overlay.innerHTML=''; },300);
}
function askConfirm(msg,onYes){
  var overlay=document.getElementById('overlay');
  overlay.style.pointerEvents='auto';
  // Append a node rather than rewriting overlay.innerHTML: re-parsing the
  // overlay would drop an open sheet's handlers and typed-in values.
  var box=document.createElement('div');
  box.className='confirm-box';
  box.innerHTML='<div class="confirm-card"><h4>'+t('confirmTitle')+'</h4><p>'+msg+'</p><div class="confirm-actions"><button class="btn btn-ghost" data-action="dismiss-confirm">'+t('cancel')+'</button><button class="btn btn-primary" data-confirm-yes>'+t('yes')+'</button></div></div>';
  overlay.appendChild(box);
  box.querySelector('[data-confirm-yes]').onclick=function(){ dismissConfirmBox(); onYes(); };
}
function dismissConfirmBox(){
  var box=document.querySelector('.confirm-box'); if(box) box.remove();
  if(!document.querySelector('.sheet')) document.getElementById('overlay').style.pointerEvents='none';
}

      '<button class="mini-btn '+(STATE.lang==='en'?'on':'')+'" data-action="set-lang" data-val="en">EN</button>'+
    '</div>'+
    '<div class="login-wrap"><div class="login-card">'+
    '<div class="login-logo">'+logoMark('logo-glow')+logoWord()+'<p>'+t('tagline')+'</p></div>'+
    '<div class="tabbar" style="width:100%;margin-bottom:16px"><button style="flex:1" class="'+(loginMode==='new'?'active':'')+'" data-action="login-mode" data-mode="new">'+t('tabNewUser')+'</button><button style="flex:1" class="'+(loginMode==='existing'?'active':'')+'" data-action="login-mode" data-mode="existing">'+t('tabExistingUser')+'</button></div>'+
    newUserForm+existingForm+
    '</div></div>';
}
function bindLogin(){
  document.querySelectorAll('.role-card').forEach(function(card){
    card.onclick=function(){
      loginRole=card.getAttribute('data-role');
      document.querySelectorAll('.role-card').forEach(function(c){c.classList.remove('sel');});
      card.classList.add('sel');
      document.getElementById('branch-field').hidden = loginRole!=='manager';
    };
  });
  var newForm=document.getElementById('new-form');
  if(newForm) newForm.onsubmit=async function(ev){
    ev.preventDefault();
    var fd=new FormData(ev.target);
    var name=(fd.get('name')||'').trim();
    var pin=(fd.get('pin')||'').trim(), pin2=(fd.get('pin2')||'').trim();
    if(!name||!pin||!pin2){ toast(t('errFill'),'err'); return; }
    if(pin.length<4||!/^\d+$/.test(pin)){ toast(t('pinLen'),'err'); return; }
    if(pin!==pin2){ toast(t('pinMismatch'),'err'); return; }
    var branchId = loginRole==='manager' ? fd.get('branchId') : null;
    var id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var pinHash=await hashPin(pin);
    var staffData={name:name,role:loginRole,roles:[loginRole],pinHash:pinHash,createdAt:new Date().toISOString()};
    if(branchId) staffData.branchId=branchId;
    await Store.set('staff',id,staffData);
    STATE.session={id:id,name:name,role:loginRole,roles:[loginRole],branchId:branchId};
    localStorage.setItem('wins_session',encodeURIComponent(JSON.stringify(STATE.session)));
    STATE.tab='dashboard';
    renderShell();
    showWelcome();
  };
  var exForm=document.getElementById('existing-form');
  if(exForm) exForm.onsubmit=async function(ev){
    ev.preventDefault();
    var fd=new FormData(ev.target);
    var staffId=fd.get('staffId'), pin=(fd.get('pin')||'').trim();
    if(!staffId||!pin){ toast(t('errFill'),'err'); return; }
    var rec=STATE.data.staff[staffId];
    if(!rec){ toast(t('errGeneric'),'err'); return; }
    var pinHash=await hashPin(pin);
    if(pinHash!==rec.pinHash){ toast(t('wrongPin'),'err'); return; }
    STATE.session={id:staffId,name:rec.name,role:rec.role,roles:rec.roles||[rec.role],branchId:rec.branchId||null};
    localStorage.setItem('wins_session',encodeURIComponent(JSON.stringify(STATE.session)));
    STATE.tab='dashboard';
    renderShell();
    showWelcome();
  };
}

/* ===================== WELCOME SEQUENCE ===================== */
/* Shown once, right after a successful sign-in: the gold lockup, the person's
   name and the role they are entering as, then it dissolves into the app. */
function showWelcome(){
  var s=STATE.session; if(!s) return;
  var el=document.createElement('div');
  el.className='welcome-gate';
  el.innerHTML=
    '<div class="welcome-halo"></div>'+
    logoMark('welcome-mark logo-glow')+
    '<div class="welcome-copy">'+
      '<span class="wc-hi">'+t('welcomeBackName')+'</span>'+
      '<b class="wc-name">'+esc(s.name)+'</b>'+
      '<span class="wc-role">'+t('role'+cap(s.role))+(s.branchId?' · '+branchName(s.branchId):'')+'</span>'+
    '</div>'+
    '<div class="welcome-bar"><i></i></div>'+
    '<div class="wc-ready">'+t('welcomeReady')+'</div>';
  document.body.appendChild(el);
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); },650); }, 2300);
}

/* ===================== ACCOUNT MENU ===================== */
function openAccountSheet(){
  var myRoles=STATE.session.roles||[STATE.session.role];
  var switcher='';
  if(myRoles.length>1){
    switcher='<div class="field"><label>'+t('switchRole')+'</label><div class="seg">'+
      myRoles.map(function(r){
        return '<div class="seg-opt '+(r===STATE.session.role?'sel':'')+'" data-action="switch-role" data-role="'+r+'">'+t('role'+cap(r))+'</div>';
      }).join('')+'</div></div>';
  }
  var body='<div style="display:flex;align-items:center;gap:13px;margin-bottom:20px"><div class="avatar" style="width:48px;height:48px;font-size:18px;border-radius:15px">'+initials(STATE.session.name)+'</div><div><b style="font-size:16px;display:block">'+esc(STATE.session.name)+'</b><span class="hint">'+t('role'+cap(STATE.session.role))+(STATE.session.branchId?' · '+branchName(STATE.session.branchId):'')+'</span></div></div>'+
    switcher+
    '<button class="btn btn-ghost btn-block" data-action="logout">'+icon('logout')+t('notYou')+'</button>';
  openSheet(t('myAccount'),body);
}

/* ===================== EVENT DELEGATION ===================== */
function bindViewActions(){}
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var action=el.getAttribute('data-action');
  if(action==='nav'){ STATE.tab=el.getAttribute('data-tab'); if(STATE.tab==='admin') adminSub='overview'; renderShell(); }
  else if(action==='login-mode'){ loginMode=el.getAttribute('data-mode'); renderShell(); }
  else if(action==='set-lang'){ STATE.lang=el.getAttribute('data-val'); localStorage.setItem('wins_lang',STATE.lang); renderShell(); }
  else if(action==='open-account'){ openAccountSheet(); }
  else if(action==='switch-role'){
    STATE.session.role=el.getAttribute('data-role');
    localStorage.setItem('wins_session',encodeURIComponent(JSON.stringify(STATE.session)));
    STATE.tab='dashboard'; closeSheet(); renderShell(); toast(t('roleSwitched'));
  }
  else if(action==='logout'){
    askConfirm(t('logoutConfirm'),function(){
      try{ localStorage.removeItem('wins_session'); }catch(e){}
      STATE.session=null; STATE.tab='dashboard'; loginMode='existing';
      closeSheet(); renderShell(); toast(t('loggedOut'));
    });
  }
  else if(action==='open-sale'){ openSaleSheet(); }
  else if(action==='open-expense'){ openExpenseSheet(); }
  else if(action==='open-bill'){ openBillSheet(); }
  else if(action==='open-pay-bill'){ openPayBillSheet(el.getAttribute('data-id')); }
  else if(action==='open-handover'){ if(!el.hasAttribute('disabled')) openHandoverSheet(); }
  else if(action==='open-collect'){ openCollectSheet(el.getAttribute('data-id')); }
  else if(action==='open-confirm-receipt'){ openConfirmReceiptSheet(el.getAttribute('data-id')); }
  else if(action==='open-city'){ openCitySheet(); }
  else if(action==='open-branch'){ openBranchSheet(); }
  else if(action==='api-test'){
    var u=(document.getElementById('api-url')||{}).value||'';
    toast(t('loading')); 
    Store.testApi(u.trim()).then(function(c){
      toast(t('connOk')+' — '+Object.keys(c).map(function(k){return k+':'+c[k];}).join(' · '));
    }).catch(function(){ toast(t('connFail'),'err'); });
  }
  else if(action==='api-save'){
    var u2=((document.getElementById('api-url')||{}).value||'').trim();
    if(!u2){ toast(t('errFill'),'err'); return; }
    Store.testApi(u2).then(function(){
      Store.setApiUrl(u2); toast(t('connOk')); setTimeout(function(){ location.reload(); },700);
    }).catch(function(){ toast(t('connFail'),'err'); });
  }
  else if(action==='api-push'){
    toast(t('loading'));
    Store.pushAll().then(function(n){ toast(t('uploaded').replace('{n}',n)); })
      .catch(function(){ toast(t('connFail'),'err'); });
  }
  else if(action==='api-clear'){
    askConfirm(t('disconnect')+'?',function(){ Store.setApiUrl(null); location.reload(); });
  }
  else if(action==='admin-sub'){ adminSub=el.getAttribute('data-sub'); renderView(); }
  else if(action==='close-sheet'){ closeSheet(); }
  else if(action==='dismiss-confirm'){ dismissConfirmBox(); }
});

/* Fallback only: when the page is embedded by a host that supplies its own <head>
   (e.g. the Artifact viewer), install the WINS mark as the icon at runtime. */
function installAppIcon(){
  if(document.querySelector('link[rel="apple-touch-icon"]')) return;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'+
    '<rect width="512" height="512" rx="112" fill="#06070B"/>'+
    '<g transform="translate(256 256) scale(1.55) translate(-288 -130)" fill="#00E6A2">'+LOGO_MARK_PATHS+'</g></svg>';
  var href='data:image/svg+xml,'+encodeURIComponent(svg);
  [['icon','image/svg+xml'],['apple-touch-icon',null],['shortcut icon','image/svg+xml']].forEach(function(p){
    var l=document.createElement('link'); l.rel=p[0]; if(p[1]) l.type=p[1]; l.href=href; document.head.appendChild(l);
  });
  var m=document.createElement('meta'); m.name='theme-color'; m.content='#06070B'; document.head.appendChild(m);
  var c=document.createElement('meta'); c.name='apple-mobile-web-app-capable'; c.content='yes'; document.head.appendChild(c);
  var s=document.createElement('meta'); s.name='apple-mobile-web-app-status-bar-style'; s.content='black-translucent'; document.head.appendChild(s);
}

/* ===================== BOOT ===================== */
async function boot(){
  installAppIcon();
  await Store.init();
  ['cities','branches','staff','sales','expenses','handovers','bills'].forEach(function(col){
    Store.onCollection(col, function(data){
      STATE.data[col]=data;
      STATE.loaded[col]=true;
      if(document.getElementById('app') && !document.getElementById('app').hidden){
        if(!STATE.session){
          if(col==='staff' || col==='branches') renderShell();
        } else if(STATE.tab && ['dashboard','sales','expenses','handover','bills','admin'].indexOf(STATE.tab)>-1 && document.getElementById('view')){
          renderView();
        }
        if(document.querySelector('.who-card')) updateTopbar();
      }
    });
  });
  // Splash: the logo fades in, turns a full 360, holds, then fades out into the app.
  var gate=document.getElementById('loading-gate');
  if(gate) gate.innerHTML=splashLockup();
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPLASH = reduced ? 700 : 4600;
  // Render the app behind the splash so it is ready the moment the curtain lifts.
  setTimeout(function(){
    document.getElementById('app').hidden=false;
    renderShell();
  }, Math.min(400,SPLASH));
  setTimeout(function(){
    if(!gate) return;
    gate.classList.add('out');
    setTimeout(function(){ gate.style.display='none'; }, 750);
  }, SPLASH);
}
boot();

})();
</script>
