<title>WINS Cash Flow</title>
<style>
:root{
  --ink:#14140f; --ink-dim:#6b6b63; --ink-faint:#9c9a90;
  --paper:#f3f1e9; --surface:#ffffff; --surface-2:#edeade;
  --line:#e0ddd0; --line-strong:#cac6b5;
  --accent:#0d7a52; --accent-ink:#ffffff; --accent-soft:#e2f2e9;
  --gold:#a8802e; --gold-soft:#f3e9d4;
  --danger:#b8402a; --danger-soft:#fbe8e3;
  --warn:#a8802e; --warn-soft:#f3e9d4;
  --shadow:0 1px 2px rgba(20,20,15,.04), 0 8px 24px -12px rgba(20,20,15,.18);
  --shadow-lg:0 12px 40px -12px rgba(20,20,15,.28);
  --radius:14px; --radius-sm:9px;
  --font-display:'Cairo',system-ui,'Segoe UI',sans-serif;
  --font-body:'Cairo',system-ui,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'Consolas',monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f2f0e8; --ink-dim:#a6a398; --ink-faint:#716e63;
    --paper:#0e0e0c; --surface:#181815; --surface-2:#201f1b;
    --line:#2c2b26; --line-strong:#3c3a33;
    --accent:#22c98a; --accent-ink:#062318; --accent-soft:rgba(34,201,138,.13);
    --gold:#d8b768; --gold-soft:rgba(216,183,104,.14);
    --danger:#ef6b52; --danger-soft:rgba(239,107,82,.14);
    --warn:#d8b768; --warn-soft:rgba(216,183,104,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 20px 60px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#f2f0e8; --ink-dim:#a6a398; --ink-faint:#716e63;
  --paper:#0e0e0c; --surface:#181815; --surface-2:#201f1b;
  --line:#2c2b26; --line-strong:#3c3a33;
  --accent:#22c98a; --accent-ink:#062318; --accent-soft:rgba(34,201,138,.13);
  --gold:#d8b768; --gold-soft:rgba(216,183,104,.14);
  --danger:#ef6b52; --danger-soft:rgba(239,107,82,.14);
  --warn:#d8b768; --warn-soft:rgba(216,183,104,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 20px 60px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);margin:0;min-height:100%;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font-family:inherit}
a{color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- layout shell ---------- */
#app{min-height:100%;display:flex}
#loading-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.boot-mark{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.boot-dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-inline-start-color:var(--accent);animation:spin 0.85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sidebar{width:236px;flex:none;background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset-block:0;inset-inline-start:0;padding:20px 16px;gap:22px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding-inline-start:6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px}
:root[data-theme="dark"] .brand-mark, :root:not([data-theme="light"]) .brand-mark{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .brand-mark{background:var(--ink);color:var(--paper)}}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text b{font-family:var(--font-display);font-weight:800;font-size:15.5px;letter-spacing:.01em}
.brand-text span{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em}

.navlist{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-dim);cursor:pointer;font-size:13.5px;font-weight:600;border:none;background:none;text-align:start;width:100%;transition:background .15s,color .15s}
.navitem svg{flex:none;width:18px;height:18px}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.active{background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] .navitem.active, :root:not([data-theme="light"]) .navitem.active{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .navitem.active{background:var(--ink);color:var(--paper)}}

.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.mini-toggle-row{display:flex;gap:6px}
.mini-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);font-size:11.5px;font-weight:700;cursor:pointer}
.mini-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.mini-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.who-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:var(--surface-2);cursor:pointer;border:1px solid transparent}
.who-card:hover{border-color:var(--line-strong)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;font-family:var(--font-display)}
.who-text{overflow:hidden}
.who-text b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-text span{font-size:10.5px;color:var(--ink-faint)}

#main{flex:1;min-width:0;margin-inline-start:236px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.topbar h2{font-size:17px;font-weight:800}
.topbar .sub{font-size:12px;color:var(--ink-faint);margin-top:2px}
.pulse{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-dim);padding:6px 10px;border:1px solid var(--line);border-radius:99px}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
#view{padding:22px 24px 100px;max-width:1180px}
.fade-in{animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.07s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.17s}.stagger>*:nth-child(5){animation-delay:.22s}.stagger>*:nth-child(n+6){animation-delay:.26s}

/* ---------- kpi & cards ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
@media (hover:hover){.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}}
.kpi .lbl{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--font-mono);font-size:25px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12px;color:var(--ink-faint);font-family:var(--font-body);font-weight:700}
.kpi .delta{font-size:11px;margin-top:5px;color:var(--ink-faint)}
.kpi.accent{border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}
.kpi.accent .val{color:var(--accent)}
.kpi.gold .val{color:var(--gold)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h3{font-size:14.5px;font-weight:800}
.card-body{padding:6px 18px 16px}
.section{margin-bottom:20px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:800;margin:0 0 10px 2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;border:1px solid transparent;cursor:pointer;transition:transform .12s,filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] .btn-primary, :root:not([data-theme="light"]) .btn-primary{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn-primary{background:var(--ink);color:var(--paper)}}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-dim)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:17px;height:17px}
.fab{position:fixed;inset-inline-end:22px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);border:none;cursor:pointer;z-index:25}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.92)}
@media(min-width:861px){.fab{bottom:26px}}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.collected{background:var(--gold-soft);color:var(--gold)}
.pill.confirmed{background:var(--accent-soft);color:var(--accent)}
.pill.gap{background:var(--danger-soft);color:var(--danger)}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-dim)}
.chip.pos{background:color-mix(in srgb,#3b6fd6 14%, transparent);color:#3b6fd6}
.chip.cash{background:var(--accent-soft);color:var(--accent)}
.chip.other{background:var(--gold-soft);color:var(--gold)}

/* ---------- rows/list ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ricon{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-dim)}
.row .ricon svg{width:17px;height:17px}
.row .rmain{flex:1;min-width:0}
.row .rmain b{font-size:13.5px;font-weight:700;display:block}
.row .rmeta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .ramt{font-family:var(--font-mono);font-weight:700;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.row .ramt.neg{color:var(--danger)}
.row .ramt.pos{color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--ink-faint)}
.empty svg{width:38px;height:38px;margin-bottom:10px;opacity:.5}
.empty b{display:block;color:var(--ink-dim);font-size:13px;margin-bottom:3px}
.empty span{font-size:12px}

/* ---------- status chain ---------- */
.chain{display:flex;align-items:flex-start;padding:6px 4px 2px}
.chain-step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.chain-node{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);z-index:2;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.chain-node svg{width:14px;height:14px}
.chain-step.done .chain-node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.05)}
.chain-step.active .chain-node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);animation:ringpulse 1.6s ease-in-out infinite}
@keyframes ringpulse{0%,100%{box-shadow:0 0 0 4px var(--accent-soft)}50%{box-shadow:0 0 0 8px transparent}}
.chain-line{position:absolute;top:15px;inset-inline-start:-50%;width:100%;height:2px;background:var(--line);z-index:1}
.chain-step:first-child .chain-line{display:none}
.chain-step.done .chain-line{background:var(--accent)}
.chain-label{font-size:11px;font-weight:800;margin-top:8px;color:var(--ink-dim)}
.chain-step.done .chain-label, .chain-step.active .chain-label{color:var(--ink)}
.chain-sub{font-size:10px;color:var(--ink-faint);margin-top:2px}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-dim);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-family:inherit;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:64px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-opt{flex:1;min-width:88px;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-dim);transition:all .15s}
.seg-opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.amt-input{position:relative}
.amt-input input{font-family:var(--font-mono);font-size:22px;font-weight:700;padding-inline-end:56px;font-variant-numeric:tabular-nums}
.amt-input .cur{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-faint);font-weight:800}
.upload-box{border:1.5px dashed var(--line-strong);border-radius:10px;padding:14px;text-align:center;cursor:pointer;color:var(--ink-faint);font-size:12px;font-weight:700}
.upload-box:hover{border-color:var(--accent);color:var(--accent)}
.upload-preview{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}
.upload-preview img{width:44px;height:44px;object-fit:cover;border-radius:8px}

/* ---------- overlay: sheet / modal / toast ---------- */
#overlay{position:fixed;inset:0;z-index:100;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,10,8,.5);opacity:0;transition:opacity .25s;pointer-events:auto}
.scrim.show{opacity:1}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.16,1,.3,1);pointer-events:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:99px;margin:10px auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 12px}
.sheet-head h3{font-size:16px;font-weight:800}
.sheet-body{padding:4px 18px 22px}
@media(min-width:640px){
  .sheet{inset-inline:auto;inset-inline-end:calc(50% - 220px);bottom:auto;top:50%;transform:translate(0,-46%) scale(.96);opacity:0;width:440px;border-radius:18px;max-height:84vh}
  .sheet.show{transform:translate(0,-50%) scale(1);opacity:1}
}
.toaster{position:fixed;inset-inline:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none;align-items:center}
@media(min-width:861px){.toaster{inset-inline:auto;inset-inline-end:24px;bottom:24px;align-items:flex-end}}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:toastIn .35s cubic-bezier(.16,1,.3,1) both;max-width:340px}
.toast svg{width:17px;height:17px;flex:none}
.toast.ok svg{color:var(--accent)}
.toast.err svg{color:#ef6b52}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.confirm-box{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-card{background:var(--surface);border-radius:16px;padding:22px;max-width:340px;width:100%;box-shadow:var(--shadow-lg);animation:fadeUp .3s cubic-bezier(.16,1,.3,1) both}
.confirm-card h4{font-size:15px;margin-bottom:8px}
.confirm-card p{font-size:12.5px;color:var(--ink-dim);margin:0 0 16px;line-height:1.5}
.confirm-actions{display:flex;gap:8px}
.confirm-actions .btn{flex:1}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:
  radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%),
  radial-gradient(circle at 85% 90%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 55%), var(--paper)}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:30px 26px;animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
.login-logo .mark{width:56px;height:56px;border-radius:16px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:22px}
:root[data-theme="dark"] .login-logo .mark, :root:not([data-theme="light"]) .login-logo .mark{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .login-logo .mark{background:var(--ink);color:var(--paper)}}
.login-logo h1{font-size:19px;font-weight:800;letter-spacing:.01em}
.login-logo p{font-size:12px;color:var(--ink-faint);margin-top:2px;text-align:center}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.role-card{border:1.5px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center;cursor:pointer;transition:all .15s}
.role-card svg{width:19px;height:19px;margin-bottom:5px;color:var(--ink-faint)}
.role-card b{display:block;font-size:12px}
.role-card.sel{border-color:var(--accent);background:var(--accent-soft)}
.role-card.sel svg{color:var(--accent)}
.lang-float{position:fixed;top:16px;inset-inline-end:16px;display:flex;gap:6px;z-index:5}

/* ---------- bottom mobile nav ---------- */
.bottomnav{display:none}
@media(max-width:860px){
  .sidebar{display:none}
  #main{margin-inline-start:0}
  .bottomnav{display:flex;position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb, var(--surface) 96%, transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);background:none;border:none;font-size:10px;font-weight:700;padding:5px 8px;border-radius:10px;flex:1}
  .bn-item svg{width:20px;height:20px}
  .bn-item.active{color:var(--accent)}
}
@media(min-width:861px){.topbar{padding-inline:32px}#view{padding-inline:32px}}

/* ===================== STORE (db capability with local fallback) ===================== */
var Store = (function(){
  var mode='local', dbns=null, assetsns=null;
  var LS_KEY='wins_cash_local_v1';
  var local=null;
  var listeners={}; // path -> [cb]

  function loadLocal(){
    try{ var raw=localStorage.getItem(LS_KEY); if(raw) return JSON.parse(decodeURIComponent(raw)); }catch(e){}
    return null;
  }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY, encodeURIComponent(JSON.stringify(local))); }catch(e){} }
  function seedLocal(){
    local={cities:{},branches:{},staff:{},sales:{},expenses:{},handovers:{}};
    CITIES_SEED.forEach(function(c){ local.cities[c.id]={nameAr:c.nameAr,nameEn:c.nameEn,order:0}; });
    BRANCHES_SEED.forEach(function(b,i){ local.branches[b.id]={nameAr:b.nameAr,nameEn:b.nameEn,cityId:b.cityId,active:true,order:i}; });
    var now=Date.now();
    function iso(offsetHrs){ return new Date(now-offsetHrs*3600000).toISOString(); }
    local.staff['seed-mgr']={name:"سارة القحطاني",role:"manager",branchId:"olaya",pinHash:DEMO_PIN_HASH,createdAt:iso(240)};
    local.staff['seed-col']={name:"محمد العتيبي",role:"collector",pinHash:DEMO_PIN_HASH,createdAt:iso(240)};
    local.staff['seed-trs']={name:"نورة الدوسري",role:"treasury",pinHash:DEMO_PIN_HASH,createdAt:iso(240)};
    local.sales['s1']={branchId:"olaya",type:"cash",amount:4200,note:"",staffId:"seed-mgr",staffName:"سارة القحطاني",createdAt:iso(5),dateKey:todayKey()};
    local.sales['s2']={branchId:"olaya",type:"pos",amount:9100,note:"",staffId:"seed-mgr",staffName:"سارة القحطاني",createdAt:iso(4),dateKey:todayKey()};
    local.sales['s3']={branchId:"olaya",type:"other",amount:1250,note:"STC Pay",staffId:"seed-mgr",staffName:"سارة القحطاني",createdAt:iso(3),dateKey:todayKey()};
    local.sales['s4']={branchId:"malaz",type:"cash",amount:3100,note:"",staffId:"seed-mgr",staffName:"فهد الحربي",createdAt:iso(6),dateKey:todayKey()};
    local.expenses['e1']={branchId:"olaya",category:"supplies",amount:350,note:"أكياس ولوازم",staffId:"seed-mgr",staffName:"سارة القحطاني",createdAt:iso(4),dateKey:todayKey()};
    local.expenses['e2']={branchId:"olaya",category:"transport",amount:120,note:"",staffId:"seed-mgr",staffName:"سارة القحطاني",createdAt:iso(2),dateKey:todayKey()};
    local.handovers['h1']={branchId:"malaz",declaredAmount:2600,note:"",status:"confirmed",managerId:"seed-mgr2",managerName:"فهد الحربي",createdAt:iso(30),collectorId:"seed-col",collectorName:"محمد العتيبي",collectedAmount:2600,collectedNote:"",collectedAt:iso(26),treasuryId:"seed-trs",treasuryName:"نورة الدوسري",confirmedAmount:2600,confirmedNote:"",confirmedAt:iso(20)};
    local.handovers['h2']={branchId:"olaya",declaredAmount:1800,note:"",status:"collected",managerId:"seed-mgr",managerName:"سارة القحطاني",createdAt:iso(10),collectorId:"seed-col",collectorName:"محمد العتيبي",collectedAmount:1750,collectedNote:"نقص 50 ريال",collectedAt:iso(7)};
    local.handovers['h3']={branchId:"tahlia",declaredAmount:3400,note:"يرجى الاستلام قبل الظهر",status:"pending",managerId:"seed-mgr3",managerName:"عبدالله الشهري",createdAt:iso(2)};
    saveLocal();
  }
  function todayKey(){ var d=new Date(); return d.toISOString().slice(0,10); }
  function emit(path){
    var col=path.split('/')[0];
    (listeners[col]||[]).forEach(function(fn){ fn(); });
  }
  function genId(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  var api = {
    mode:function(){return mode;},
    async init(){
      try{
        if(window.claude && typeof window.claude.use==='function'){
          dbns = await window.claude.use('db').catch(function(){return null;});
          assetsns = await window.claude.use('assets').catch(function(){return null;});
        }
      }catch(e){}
      if(dbns){ mode='db'; }
      else { mode='local'; local=loadLocal(); if(!local) seedLocal(); }
    },
    onCollection(col, cb){
      if(mode==='db'){
        return dbns.collection(col).onSnapshot(function(snap){
          var out={};
          snap.docs.forEach(function(d){ out[d.id]=d.data(); });
          cb(out);
        }, function(err){ console.warn('db err',col,err); });
      } else {
        listeners[col]=listeners[col]||[];
        var fn=function(){ cb(Object.assign({},local[col])); };
        listeners[col].push(fn);
        setTimeout(fn,0);
        return function(){ listeners[col]=listeners[col].filter(function(x){return x!==fn;}); };
      }
    },
    async add(col, data){
      if(mode==='db'){
        var ref = await dbns.collection(col).add(data);
        return ref.id;
      } else {
        var id=genId();
        local[col][id]=data;
        saveLocal(); emit(col);
        return id;
      }
    },
    async set(col,id,data){
      if(mode==='db'){ await dbns.doc(col+'/'+id).set(data); }
      else { local[col][id]=data; saveLocal(); emit(col); }
    },
    async update(col,id,data){
      if(mode==='db'){ await dbns.doc(col+'/'+id).update(data); }
      else { local[col][id]=Object.assign({},local[col][id]||{},data); saveLocal(); emit(col); }
    },
    async uploadAsset(file){
      if(mode==='db' && assetsns){
        var r = await assetsns.upload(file);
        return {id:r.id, url:r.url};
      }
      return new Promise(function(resolve){
        var reader=new FileReader();
        reader.onload=function(){ resolve({id:null,url:reader.result}); };
        reader.readAsDataURL(file);
      });
    }
  };
  return api;
})();

  lang: (localStorage.getItem('wins_lang')||( (navigator.language||'ar').indexOf('ar')===0 ? 'ar':'ar')),
  theme: localStorage.getItem('wins_theme')||'',
  session: null,
  tab:'dashboard',
  data:{cities:{},branches:{},staff:{},sales:{},expenses:{},handovers:{}},
  loaded:{cities:false,branches:false,staff:false,sales:false,expenses:false,handovers:false}
};
try{ var s=localStorage.getItem('wins_session'); if(s) STATE.session=JSON.parse(decodeURIComponent(s)); }catch(e){}
if(STATE.theme) document.documentElement.setAttribute('data-theme',STATE.theme);

function fmtMoney(n){
  n = Math.round((n||0)*100)/100;
  var s = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  return (n<0?'-':'')+s;
}
function fmtDate(iso){
  try{
    var d=new Date(iso);
    return d.toLocaleString(STATE.lang==='ar'?'ar-SA':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function branchName(id){ var b=STATE.data.branches[id]; if(!b) return id||''; return STATE.lang==='ar'?b.nameAr:b.nameEn; }
function cityName(id){ var c=STATE.data.cities[id]; if(!c) return id||''; return STATE.lang==='ar'?c.nameAr:c.nameEn; }
function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }

/* ===================== TOASTS ===================== */
function toast(msg,kind){
  var box=document.getElementById('toaster');
  var el=document.createElement('div');
  el.className='toast '+(kind||'ok');
  el.innerHTML=icon(kind==='err'?'alert':'check')+'<span>'+msg+'</span>';
  box.appendChild(el);
  setTimeout(function(){ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(function(){ el.remove(); },300); },2600);
}

/* ===================== ANIMATED COUNTER ===================== */
function animateValue(el,to){
  if(!el) return;
  var from=0, dur=750, start=null;
  function step(ts){
    if(!start) start=ts;
    var p=Math.min(1,(ts-start)/dur);
    var eased=1-Math.pow(1-p,3);
    el.textContent=fmtMoney(from+(to-from)*eased);
    if(p<1) requestAnimationFrame(step);
    else el.textContent=fmtMoney(to);
  }
  requestAnimationFrame(step);
}

/* ===================== DERIVED DATA HELPERS ===================== */
function branchesInCity(cityId){ return Object.keys(STATE.data.branches).filter(function(id){return STATE.data.branches[id].cityId===cityId;}); }
function allBranchIds(){ return Object.keys(STATE.data.branches); }
function salesFor(branchId,period){
  return Object.keys(STATE.data.sales).map(function(id){ return Object.assign({id:id},STATE.data.sales[id]); })
    .filter(function(s){ return (!branchId||s.branchId===branchId) && inPeriod(s.createdAt,period); });
}
function expensesFor(branchId,period){
  return Object.keys(STATE.data.expenses).map(function(id){ return Object.assign({id:id},STATE.data.expenses[id]); })
    .filter(function(e){ return (!branchId||e.branchId===branchId) && inPeriod(e.createdAt,period); });
}
function handoversFor(branchId){
  return Object.keys(STATE.data.handovers).map(function(id){ return Object.assign({id:id},STATE.data.handovers[id]); })
    .filter(function(h){ return !branchId||h.branchId===branchId; })
    .sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); });
}
function inPeriod(iso,period){
  if(!period||period==='all') return true;
  var d=new Date(iso), now=new Date();
  if(period==='today') return d.toDateString()===now.toDateString();
  if(period==='week'){ var wk=7*24*3600000; return (now-d)<wk; }
  return true;
}
function cashOnHand(branchId){
  var cash=salesFor(branchId,'all').filter(function(s){return s.type==='cash';}).reduce(function(a,s){return a+Number(s.amount||0);},0);
  var exp=expensesFor(branchId,'all').reduce(function(a,e){return a+Number(e.amount||0);},0);
  var handed=handoversFor(branchId).reduce(function(a,h){return a+Number(h.declaredAmount||0);},0);
  return cash-exp-handed;
}
function sumSalesByType(branchId,period,type){
  return salesFor(branchId,period).filter(function(s){return !type||s.type===type;}).reduce(function(a,s){return a+Number(s.amount||0);},0);
}
function sumExpenses(branchId,period){ return expensesFor(branchId,period).reduce(function(a,e){return a+Number(e.amount||0);},0); }

function navItemHtml(tab,ic,label){

function bnItemHtml(tab,ic,label){

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function currentIsDark(){
  if(STATE.theme==='dark') return true;
  if(STATE.theme==='light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

function updateTopbar(){
  var titleMap={dashboard:'navDashboard',sales:'navSales',expenses:'navExpenses',handover:'navHandover',admin:'navAdmin'};
  var titleEl=document.getElementById('topbar-title');
  if(titleEl) titleEl.textContent=t(titleMap[STATE.tab]||'navDashboard');
  var subEl=document.getElementById('topbar-sub');
  if(subEl){

    if(STATE.session.branchId) parts.push(branchName(STATE.session.branchId));

    subEl.textContent=parts.join(' · ');

    var net=Object.keys(STATE.data.handovers).length;
    pulseText.textContent = Store.mode()==='db' ? (STATE.lang==='ar'?'مباشر':'Live') : (STATE.lang==='ar'?'محلي':'Local');

/* ===================== VIEW ROUTER ===================== */
function renderView(){
  var v=document.getElementById('view');
  if(!v) return;
  var role=STATE.session.role;
  var html='';
  if(STATE.tab==='dashboard') html=renderDashboard(role);
  else if(STATE.tab==='sales') html=renderSales();
  else if(STATE.tab==='expenses') html=renderExpenses();
  else if(STATE.tab==='handover') html=renderHandover(role);
  else if(STATE.tab==='admin') html=renderAdmin();
  v.innerHTML=html;
  updateTopbar();
  // animate kpi counters
  v.querySelectorAll('[data-count]').forEach(function(el){ animateValue(el, Number(el.getAttribute('data-count'))); });
  bindViewActions();
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(role){
  if(Store.mode()==='local'){
    var banner='<div class="card fade-in" style="padding:11px 16px;margin-bottom:16px;display:flex;gap:9px;align-items:center;border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:700;">'+icon('alert')+'<span>'+t('localModeBanner')+'</span></div>';
  } else banner='';
  if(role==='manager') return banner+dashManager();
  if(role==='collector') return banner+dashCollector();
  if(role==='treasury') return banner+dashTreasury();
  return banner+dashAdmin();
}

function dashManager(){
  var bId=STATE.session.branchId;
  var cash=sumSalesByType(bId,'today','cash'), pos=sumSalesByType(bId,'today','pos'), other=sumSalesByType(bId,'today','other');
  var totalToday=cash+pos+other, exp=sumExpenses(bId,'today');
  var onHand=cashOnHand(bId);
  var recent=[].concat(salesFor(bId,'week').map(function(s){return Object.assign({kind:'sale'},s);}),expensesFor(bId,'week').map(function(e){return Object.assign({kind:'expense'},e);}))
    .sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);}).slice(0,8);
  var html='<div class="kpi-grid stagger">'+
    kpi(t('cashOnHand'),onHand,'accent',t('cashFormula'))+
    kpi(t('todaySales'),totalToday,'',t('sar'))+
    kpi(t('todayExpenses'),exp,'',t('sar'))+
    '</div>';
  html+='<div class="section"><div class="section-title">'+t('recentActivity')+'</div><div class="card"><div class="card-body">'+
    (recent.length?recent.map(activityRow).join(''):emptyState('clock',t('noSalesYet'),t('startAdding')))+
  '</div></div></div>';
  return html;
}
function dashCollector(){
  var pend=Object.keys(STATE.data.handovers).map(function(id){return Object.assign({id:id},STATE.data.handovers[id]);}).filter(function(h){return h.status==='pending';});
  var mine=Object.keys(STATE.data.handovers).map(function(id){return Object.assign({id:id},STATE.data.handovers[id]);}).filter(function(h){return h.status==='collected';});
  var pendAmt=pend.reduce(function(a,h){return a+Number(h.declaredAmount||0);},0);
  var html='<div class="kpi-grid stagger">'+
    kpi(t('pendingPickups'),pend.length,'gold',null,true)+
    kpi(STATE.lang==='ar'?'إجمالي المبالغ المعلنة':'Total Declared',pendAmt,'',t('sar'))+
    kpi(t('pendingConfirm'),mine.length,'accent',null,true)+
    '</div>';
  html+='<div class="section"><div class="section-title">'+t('pendingPickups')+'</div><div class="card"><div class="card-body">'+
    (pend.length?pend.slice(0,6).map(function(h){return handoverCard('collector',h);}).join(''):emptyState('truck',t('noPending'),t('allCaughtUp')))+
  '</div></div></div>';
  return html;
}
function dashTreasury(){
  var col=Object.keys(STATE.data.handovers).map(function(id){return Object.assign({id:id},STATE.data.handovers[id]);}).filter(function(h){return h.status==='collected';});
  var confirmedThisMonth=Object.keys(STATE.data.handovers).map(function(id){return Object.assign({id:id},STATE.data.handovers[id]);})
    .filter(function(h){return h.status==='confirmed';});
  var confAmt=confirmedThisMonth.reduce(function(a,h){return a+Number(h.confirmedAmount||0);},0);
  var colAmt=col.reduce(function(a,h){return a+Number(h.collectedAmount||0);},0);
  var html='<div class="kpi-grid stagger">'+
    kpi(t('pendingConfirm'),col.length,'gold',null,true)+
    kpi(STATE.lang==='ar'?'بانتظار التأكيد (مبلغ)':'Awaiting (amount)',colAmt,'',t('sar'))+
    kpi(t('networkConfirmed'),confAmt,'accent',t('sar'))+
    '</div>';
  html+='<div class="section"><div class="section-title">'+t('pendingConfirm')+'</div><div class="card"><div class="card-body">'+
    (col.length?col.slice(0,6).map(function(h){return handoverCard('treasury',h);}).join(''):emptyState('bank',t('noCollected'),t('allCaughtUp')))+
  '</div></div></div>';
  return html;
}
function dashAdmin(){
  var branches=allBranchIds();
  var totalSales=sumSalesByType(null,'today',null);
  var transit=Object.keys(STATE.data.handovers).map(function(id){return STATE.data.handovers[id];}).filter(function(h){return h.status!=='confirmed';}).reduce(function(a,h){return a+Number(h.declaredAmount||0);},0);
  var confMonth=Object.keys(STATE.data.handovers).map(function(id){return STATE.data.handovers[id];}).filter(function(h){return h.status==='confirmed';}).reduce(function(a,h){return a+Number(h.confirmedAmount||0);},0);
  var html='<div class="kpi-grid stagger">'+
    kpi(t('totalBranches'),branches.length,'',null,true)+
    kpi(t('todaySales'),totalSales,'',t('sar'))+
    kpi(t('networkCashTransit'),transit,'gold',t('sar'))+
    kpi(t('networkConfirmed'),confMonth,'accent',t('sar'))+
  '</div>';
  html+='<div class="section"><div class="section-title">'+t('branchPerf')+'</div><div class="card"><div class="card-body" style="padding-top:12px">'+branchPerfTable()+'</div></div></div>';
  return html;
}
function kpi(label,value,cls,suffix,isCount){
  return '<div class="kpi '+(cls||'')+'"><div class="lbl">'+label+'</div><div class="val">'+
    (isCount? '<span data-count-int="'+value+'">'+value+'</span>' : '<span class="mono" data-count="'+value+'">0</span>'+(suffix?' <small>'+suffix+'</small>':''))
    +'</div></div>';
}
function branchPerfTable(){
  var rows=allBranchIds().map(function(id){
    var s=sumSalesByType(id,'week',null), e=sumExpenses(id,'week'), net=s-e;
    return {id:id,name:branchName(id),city:cityName(STATE.data.branches[id].cityId),s:s,e:e,net:net};
  }).sort(function(a,b){return b.s-a.s;});
  if(!rows.length) return emptyState('building',STATE.lang==='ar'?'لا توجد فروع بعد':'No branches yet','');
  var maxS=Math.max.apply(null,rows.map(function(r){return r.s;}).concat([1]));
  return '<table class="datatable"><thead><tr><th>'+t('manageBranches')+'</th><th>'+t('sales')+' ('+t('period_week')+')</th><th></th><th>'+t('expenses')+'</th><th>'+t('netCash')+'</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td><b>'+esc(r.name)+'</b><div class="hint">'+esc(r.city)+'</div></td>'+
        '<td class="mono">'+fmtMoney(r.s)+'</td>'+
        '<td style="min-width:90px"><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(r.s/maxS*100)+'%"></div></div></td>'+
        '<td class="mono">'+fmtMoney(r.e)+'</td>'+
        '<td class="mono" style="color:var(--accent);font-weight:700">'+fmtMoney(r.net)+'</td></tr>';
    }).join('')+
  '</tbody></table>';
}
function activityRow(item){
  var isSale=item.kind==='sale';
  var ic=isSale?(item.type==='pos'?'bank':item.type==='cash'?'wallet':'wallet'):'expenses';
  var title=isSale? (STATE.lang==='ar'?'عملية بيع':'Sale') + ' · '+catLabel(PAY_TYPES,item.type) : (STATE.lang==='ar'?'مصروف':'Expense')+' · '+catLabel(EXP_CATS,item.category);
  return '<div class="row"><div class="ricon">'+icon(ic)+'</div><div class="rmain"><b>'+title+'</b><div class="rmeta"><span>'+fmtDate(item.createdAt)+'</span><span>·</span><span>'+esc(item.staffName||'')+'</span>'+(item.note?'<span>·</span><span>'+esc(item.note)+'</span>':'')+'</div></div><div class="ramt '+(isSale?'pos':'neg')+'">'+(isSale?'+':'−')+' '+fmtMoney(item.amount)+'</div></div>';
}
function emptyState(ic,title,sub){
  return '<div class="empty">'+icon(ic)+'<b>'+title+'</b><span>'+(sub||'')+'</span></div>';
}

function chainHtml(h){
  var step= h.status==='pending'?0 : h.status==='collected'?1 : 2;
  function stepCls(i){ if(i<step) return 'done'; if(i===step) return (i===2?'done':'active'); return ''; }
  var s0cls = 'done';
  var s1cls = step>=1 ? 'done' : (step===0?'active':'');
  var s2cls = step>=2 ? 'done' : (step===1?'active':'');
  return '<div class="chain">'+
    '<div class="chain-step '+s0cls+'"><div class="chain-line"></div><div class="chain-node">'+icon('check')+'</div><div class="chain-label">'+t('stepDeclared')+'</div><div class="chain-sub">'+esc(h.managerName||'')+'</div></div>'+
    '<div class="chain-step '+s1cls+'"><div class="chain-line"></div><div class="chain-node">'+(step>=1?icon('check'):icon('truck'))+'</div><div class="chain-label">'+t('stepCollected')+'</div><div class="chain-sub">'+esc(h.collectorName||'—')+'</div></div>'+
    '<div class="chain-step '+s2cls+'"><div class="chain-line"></div><div class="chain-node">'+(step>=2?icon('check'):icon('bank'))+'</div><div class="chain-label">'+t('stepConfirmed')+'</div><div class="chain-sub">'+esc(h.treasuryName||'—')+'</div></div>'+
  '</div>';
}
function handoverCard(role,h){
  var pillCls=h.status, pillLabel=t('status'+cap(h.status));
  var gap = (h.status!=='pending' && Number(h.collectedAmount)!==Number(h.declaredAmount));
  var actions='';
  if(role==='collector' && h.status==='pending') actions='<button class="btn btn-primary btn-sm btn-block" data-action="open-collect" data-id="'+h.id+'">'+icon('check')+t('collectBtn')+'</button>';
  if(role==='treasury' && h.status==='collected') actions='<button class="btn btn-primary btn-sm btn-block" data-action="open-confirm-receipt" data-id="'+h.id+'">'+icon('check')+t('confirmReceiptBtn')+'</button>';
  return '<div class="card section" style="padding:16px">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px">'+
      '<div><b style="font-size:14px">'+branchName(h.branchId)+'</b><div class="hint">'+fmtDate(h.createdAt)+'</div></div>'+
      '<div style="text-align:end"><div class="pill '+pillCls+'">'+pillLabel+'</div>'+(gap?'<div class="pill gap" style="margin-top:4px">'+icon('alert')+' '+t('gapFlag')+'</div>':'')+'</div>'+
    '</div>'+
    chainHtml(h)+
    '<div class="divider"></div>'+
    '<div class="grid2" style="font-size:12.5px">'+
      '<div><span class="hint">'+t('declaredAmount')+'</span><div class="mono" style="font-weight:700;font-size:15px">'+fmtMoney(h.declaredAmount)+'</div></div>'+
      (h.status!=='pending'?'<div><span class="hint">'+t('receivedAmount')+'</span><div class="mono" style="font-weight:700;font-size:15px;color:'+(gap?'var(--danger)':'var(--ink)')+'">'+fmtMoney(h.collectedAmount)+'</div></div>':'')+
      (h.status==='confirmed'?'<div><span class="hint">'+t('finalAmount')+'</span><div class="mono" style="font-weight:700;font-size:15px;color:var(--accent)">'+fmtMoney(h.confirmedAmount)+'</div></div>':'')+
    '</div>'+
    (actions?'<div style="margin-top:12px">'+actions+'</div>':'')+
  '</div>';
}

/* ===================== SHEET / MODAL SYSTEM ===================== */
function openSheet(title, bodyHtml, onMount){
  var overlay=document.getElementById('overlay');
  overlay.innerHTML='<div class="scrim" data-action="close-sheet"></div><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><h3>'+title+'</h3><button class="icon-btn" data-action="close-sheet">'+icon('x')+'</button></div><div class="sheet-body">'+bodyHtml+'</div></div>';
  overlay.style.pointerEvents='auto';
  requestAnimationFrame(function(){
    overlay.querySelector('.scrim').classList.add('show');
    overlay.querySelector('.sheet').classList.add('show');
  });
  if(onMount) onMount(overlay);
}
function closeSheet(){
  var overlay=document.getElementById('overlay');
  var scrim=overlay.querySelector('.scrim'), sheet=overlay.querySelector('.sheet');
  if(scrim) scrim.classList.remove('show');
  if(sheet) sheet.classList.remove('show');
  overlay.style.pointerEvents='none';
  setTimeout(function(){ overlay.innerHTML=''; },300);
}
function askConfirm(msg,onYes){
  var overlay=document.getElementById('overlay');
  overlay.style.pointerEvents='auto';
  overlay.innerHTML+='<div class="confirm-box"><div class="confirm-card"><h4>'+t('confirmTitle')+'</h4><p>'+msg+'</p><div class="confirm-actions"><button class="btn btn-ghost" data-action="dismiss-confirm">'+t('cancel')+'</button><button class="btn btn-primary" id="confirm-yes">'+t('yes')+'</button></div></div></div>';
  document.getElementById('confirm-yes').onclick=function(){ dismissConfirmBox(); onYes(); };
}
function dismissConfirmBox(){
  var box=document.querySelector('.confirm-box'); if(box) box.remove();
  if(!document.querySelector('.sheet')) document.getElementById('overlay').style.pointerEvents='none';
}

function bindLogin(){
  document.querySelectorAll('.role-card').forEach(function(card){
    card.onclick=function(){
      loginRole=card.getAttribute('data-role');
      document.querySelectorAll('.role-card').forEach(function(c){c.classList.remove('sel');});
      card.classList.add('sel');
      document.getElementById('branch-field').hidden = loginRole!=='manager';
    };
  });
  var newForm=document.getElementById('new-form');
  if(newForm) newForm.onsubmit=async function(ev){
    ev.preventDefault();
    var fd=new FormData(ev.target);
    var name=(fd.get('name')||'').trim();
    var pin=(fd.get('pin')||'').trim(), pin2=(fd.get('pin2')||'').trim();
    if(!name||!pin||!pin2){ toast(t('errFill'),'err'); return; }
    if(pin.length<4||!/^\d+$/.test(pin)){ toast(t('pinLen'),'err'); return; }
    if(pin!==pin2){ toast(t('pinMismatch'),'err'); return; }
    var branchId = loginRole==='manager' ? fd.get('branchId') : null;
    var id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var pinHash=await hashPin(pin);
    var staffData={name:name,role:loginRole,pinHash:pinHash,createdAt:new Date().toISOString()};
    if(branchId) staffData.branchId=branchId;
    await Store.set('staff',id,staffData);
    STATE.session={id:id,name:name,role:loginRole,branchId:branchId};
    localStorage.setItem('wins_session',encodeURIComponent(JSON.stringify(STATE.session)));
    STATE.tab='dashboard';
    renderShell();
  };
  var exForm=document.getElementById('existing-form');
  if(exForm) exForm.onsubmit=async function(ev){
    ev.preventDefault();
    var fd=new FormData(ev.target);
    var staffId=fd.get('staffId'), pin=(fd.get('pin')||'').trim();
    if(!staffId||!pin){ toast(t('errFill'),'err'); return; }
    var rec=STATE.data.staff[staffId];
    if(!rec){ toast(t('errGeneric'),'err'); return; }
    var pinHash=await hashPin(pin);
    if(pinHash!==rec.pinHash){ toast(t('wrongPin'),'err'); return; }
    STATE.session={id:staffId,name:rec.name,role:rec.role,branchId:rec.branchId||null};
    localStorage.setItem('wins_session',encodeURIComponent(JSON.stringify(STATE.session)));
    STATE.tab='dashboard';
    renderShell();
  };
}

/* ===================== ACCOUNT MENU ===================== */
function openAccountSheet(){
  var body='<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div class="avatar" style="width:44px;height:44px;font-size:16px">'+initials(STATE.session.name)+'</div><div><b style="font-size:15px;display:block">'+esc(STATE.session.name)+'</b><span class="hint">'+t('role'+cap(STATE.session.role))+(STATE.session.branchId?' · '+branchName(STATE.session.branchId):'')+'</span></div></div>'+
    '<button class="btn btn-ghost btn-block" data-action="logout">'+icon('logout')+t('notYou')+'</button>';
  openSheet(t('yourName'),body);
}

/* ===================== EVENT DELEGATION ===================== */
function bindViewActions(){}
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-action]');
  if(!el) return;
  var action=el.getAttribute('data-action');
  if(action==='nav'){ STATE.tab=el.getAttribute('data-tab'); if(STATE.tab==='admin') adminSub='overview'; renderShell(); }
  else if(action==='login-mode'){ loginMode=el.getAttribute('data-mode'); renderShell(); }
  else if(action==='set-lang'){ STATE.lang=el.getAttribute('data-val'); localStorage.setItem('wins_lang',STATE.lang); renderShell(); }
  else if(action==='toggle-theme'){ STATE.theme = currentIsDark() ? 'light':'dark'; localStorage.setItem('wins_theme',STATE.theme); document.documentElement.setAttribute('data-theme',STATE.theme); renderShell(); }
  else if(action==='open-account'){ openAccountSheet(); }
  else if(action==='logout'){ localStorage.removeItem('wins_session'); STATE.session=null; closeSheet(); renderShell(); }
  else if(action==='open-sale'){ openSaleSheet(); }
  else if(action==='open-expense'){ openExpenseSheet(); }
  else if(action==='open-handover'){ if(!el.hasAttribute('disabled')) openHandoverSheet(); }
  else if(action==='open-collect'){ openCollectSheet(el.getAttribute('data-id')); }
  else if(action==='open-confirm-receipt'){ openConfirmReceiptSheet(el.getAttribute('data-id')); }
  else if(action==='open-city'){ openCitySheet(); }
  else if(action==='open-branch'){ openBranchSheet(); }
  else if(action==='admin-sub'){ adminSub=el.getAttribute('data-sub'); renderView(); }
  else if(action==='close-sheet'){ closeSheet(); }
  else if(action==='dismiss-confirm'){ dismissConfirmBox(); }
});

/* ===================== BOOT ===================== */
async function boot(){
  await Store.init();
  ['cities','branches','staff','sales','expenses','handovers'].forEach(function(col){
    Store.onCollection(col, function(data){
      STATE.data[col]=data;
      STATE.loaded[col]=true;
      if(document.getElementById('app') && !document.getElementById('app').hidden){
        if(!STATE.session){
          if(col==='staff' || col==='branches') renderShell();
        } else if(STATE.tab && ['dashboard','sales','expenses','handover','admin'].indexOf(STATE.tab)>-1 && document.getElementById('view')){
          renderView();
        }
        if(document.querySelector('.who-card')) updateTopbar();
      }
    });
  });
  // wait a tick for first snapshot batch
  setTimeout(function(){
    document.getElementById('loading-gate').style.display='none';
    document.getElementById('app').hidden=false;
    renderShell();
  }, 220);
}
boot();

})();
</script>
